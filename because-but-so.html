<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Because, But, So</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --focus: #0B62A4;
    --board: #F2D9A6;
    --because: #A8D5CB;
    --but: #F4B5A0;
    --so: #A9CCEB;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--mist); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }

  .page {
    height: 100%; max-width: 1400px; margin: 0 auto;
    padding: clamp(0.75rem, 2vw, 1.5rem) clamp(1rem, 3vw, 2.25rem);
    display: flex; flex-direction: column; gap: clamp(0.5rem, 1.5vh, 1rem);
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .top h1 { margin: 0; font-size: clamp(1.5rem, 2.8vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .back { color: var(--ink-soft); font-size: 0.95rem; text-decoration: none; white-space: nowrap; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .board {
    flex: 1; min-height: 0; background: var(--board); border-radius: 0.9rem;
    padding: clamp(1rem, 3vw, 2.5rem); display: flex; flex-direction: column;
  }
  .prompt { margin: 0; font-size: clamp(1rem, 1.6vw, 1.3rem); color: var(--ink-soft); font-weight: 600; }

  .stem-wrap { flex: 1; display: flex; align-items: center; min-height: 0; }
  .stem {
    margin: 0; font-size: clamp(1.8rem, min(5vw, 8vh), 4.2rem); font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance;
  }
  .stem .join {
    display: inline-block; padding: 0 0.3em; border-radius: 0.35em;
    background: var(--c); animation: pop 0.35s ease-out;
  }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(0.6rem, 1.6vw, 1.1rem); }
  .tile {
    background: var(--c); border-radius: 0.9rem; text-align: center;
    padding: clamp(0.7rem, 2.5vh, 1.6rem) 0.5rem;
    font-size: clamp(1.4rem, min(3.2vw, 5vh), 2.6rem); font-weight: 800; letter-spacing: -0.01em;
    opacity: 0.3; transform: scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
  }
  .tile.long { font-size: clamp(1rem, min(2vw, 3.4vh), 1.7rem); }
  .tile.on { opacity: 1; transform: scale(1); box-shadow: inset 0 0 0 3px var(--ink); }
  .because { --c: var(--because); }
  .but { --c: var(--but); }
  .so { --c: var(--so); }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
  .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  button.btn {
    font: inherit; font-weight: 600; font-size: 1rem; padding: 0.55em 1.1em; border-radius: 0.6rem;
    border: 2px solid var(--ink); background: var(--ink); color: var(--mist); cursor: pointer;
  }
  button.btn.ghost { background: transparent; color: var(--ink); }
  button.btn:hover { filter: brightness(1.15); }
  button.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .level { display: inline-flex; border: 2px solid var(--ink); border-radius: 0.6rem; overflow: hidden; }
  .lv { font: inherit; font-weight: 700; font-size: 1rem; padding: 0.45em 1em; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .lv.on { background: var(--ink); color: var(--mist); }
  .lv:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .count { font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  @media (max-width: 700px) {
    html, body, .page { height: auto; }
    .stem-wrap { min-height: 40vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .stem .join { animation: none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <h1>Because, But, So</h1>
    <a class="back" href="https://coastoflight.github.io/word-lab">&larr; Word Lab</a>
  </div>

  <section class="board">
    <p class="prompt">Complete the sentence. Use the word that lights up.</p>

    <div class="stem-wrap">
      <p class="stem" id="stem"></p>
    </div>

    <div class="tiles" aria-hidden="true">
      <div class="tile because" data-j="reason"></div>
      <div class="tile but" data-j="contrast"></div>
      <div class="tile so" data-j="result"></div>
    </div>
  </section>

  <div class="bar">
    <div class="controls">
      <button class="btn ghost" id="prev">Back</button>
      <button class="btn" id="next">Show the word</button>
      <span class="count" id="count"></span>
    </div>
    <div class="level" role="group" aria-label="Level">
      <button class="lv on" data-lv="a2">A2</button>
      <button class="lv" data-lv="b1">B1</button>
      <button class="lv" data-lv="b2">B2</button>
    </div>
  </div>

</div>

<script>
  const stems = {
    a2: [
      "I love the summer", "I don't like Mondays", "My brother is always tired", "I want a dog",
      "It rained all weekend", "My phone is very old", "I'm hungry", "I went to the beach yesterday",
      "My best friend is really funny", "I didn't do my homework", "I like playing video games",
      "I don't like vegetables", "The bus was late this morning", "I'm learning English",
      "My bedroom is very small", "I want to go to London", "I got up early on Saturday",
      "My teacher is very nice", "I lost my keys", "I like watching films at home",
      "It's very hot today", "I don't like shopping", "I'm going to a party tonight",
      "My dad cooks every Sunday", "I can't swim very well"
    ],
    b1: [
      "I've never been on a plane", "I'd like to live in another country", "I spend too much time on my phone",
      "Our school should start later", "I'm saving money", "I was really nervous before the exam",
      "I've been learning English for years", "My town is quite quiet", "I prefer texting to phoning",
      "I stayed at home last weekend", "I'm not very good at maths", "I'd love to be famous",
      "The summer holidays are too long", "I usually walk to school", "My friend forgot my birthday",
      "I don't really like big parties", "I want to learn to drive", "Homework is important",
      "I've started a new hobby", "Online shopping is really easy", "I often feel tired in the morning",
      "I'm going to study abroad one day", "Football is the best sport", "I tried sushi for the first time",
      "Our city needs more parks"
    ],
    b2: [
      "Social media is useful", "Everyone should learn a second language", "Video games can be good for you",
      "Tourists are changing my city", "Mobile phones should be banned in schools", "Working from home is the future",
      "Fast fashion is very popular", "Exams don't show what students really know", "AI can write essays",
      "Famous people have a lot of influence", "Public transport should be free", "Living in a big city is exciting",
      "Young people should be able to vote at 16", "School uniforms are still common",
      "Recycling isn't enough to save the planet", "Sport should be compulsory at school",
      "Streaming has changed the music industry", "Travelling is the best way to learn",
      "Many people eat too much meat", "Money can't buy happiness", "Robots will do many of our jobs",
      "Reading is less popular than it used to be", "A part-time job is a good idea for teenagers",
      "Space exploration is very expensive", "Being bilingual gives you an advantage"
    ]
  };

  // Linking words for each level. Each job (reason, contrast, result) can
  // have more than one word; B2 mixes them. "start" words go at the front.
  const W = {
    because:      { w: "because" },
    but:          { w: "but" },
    so:           { w: "so" },
    since:        { w: "since" },
    as:           { w: "as" },
    however:      { w: "However,", sentence: true },
    although:     { w: "although", comma: true },
    therefore:    { w: "Therefore,", sentence: true },
    consequently: { w: "Consequently,", sentence: true }
  };
  const LINKS = {
    a2: { reason: ["because"], contrast: ["but"], result: ["so"] },
    b1: { reason: ["because"], contrast: ["but"], result: ["so"] },
    b2: { reason: ["since"], contrast: ["although"], result: ["consequently"] }
  };
  const CLASS = { reason: "because", contrast: "but", result: "so" };

  // Three cycles through the 25 sentences. In each cycle a sentence gets a
  // different job, so by the end every sentence has used all three.
  const FUNCS = ["reason", "contrast", "result"];
  function buildSteps(list, lv) {
    const steps = [];
    for (let cycle = 0; cycle < 3; cycle++) {
      list.forEach((s, i) => {
        const f = FUNCS[(i + cycle) % 3], opts = LINKS[lv][f];
        steps.push({ s, f, key: opts[i % opts.length] });
      });
    }
    return steps;
  }
  const steps = { a2: buildSteps(stems.a2, "a2"), b1: buildSteps(stems.b1, "b1"), b2: buildSteps(stems.b2, "b2") };
  const pos = { a2: 0, b1: 0, b2: 0 };
  let level = "a2";
  let revealed = false;

  const stemEl = document.getElementById("stem");
  const countEl = document.getElementById("count");
  const nextBtn = document.getElementById("next");
  const tiles = document.querySelectorAll(".tile");

  const plain = k => W[k].w.replace(/,$/, "").toLowerCase();
  // lower-case the first letter, but keep things like "AI"
  const lower = t => /^[A-Z][A-Z]/.test(t) ? t : t.charAt(0).toLowerCase() + t.slice(1);

  function chip(step) {
    const j = document.createElement("span");
    j.className = "join " + CLASS[step.f];
    j.textContent = W[step.key].w;
    return j;
  }

  function show() {
    const list = steps[level], step = list[pos[level]], link = W[step.key];
    tiles.forEach(t => {
      const lit = revealed && t.dataset.j === step.f;
      t.textContent = lit ? plain(step.key) : LINKS[level][t.dataset.j].map(plain).join(" / ");
      t.classList.toggle("on", lit);
      t.classList.toggle("long", t.textContent.length > 12);
    });
    stemEl.innerHTML = "";
    if (!revealed) {
      stemEl.append(step.s + " …");
    } else if (link.start) {
      stemEl.append(chip(step), " " + lower(step.s) + ", …");
    } else {
      stemEl.append(step.s + (link.sentence ? ". " : link.comma ? ", " : " "), chip(step), " …");
    }
    nextBtn.textContent = revealed ? "Next" : "Show the word";
    countEl.textContent = `${pos[level] + 1} / ${list.length}`;
  }

  function move(d) {
    const n = steps[level].length;
    pos[level] = (pos[level] + d + n) % n;
    revealed = false;
    show();
  }

  function forward() {
    if (!revealed) { revealed = true; show(); } else { move(1); }
  }

  nextBtn.addEventListener("click", forward);
  document.getElementById("prev").addEventListener("click", () => move(-1));
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") forward();
    if (e.key === "ArrowLeft") move(-1);
  });
  document.querySelectorAll(".lv").forEach(b => b.addEventListener("click", () => {
    level = b.dataset.lv;
    revealed = false;
    document.querySelectorAll(".lv").forEach(x => x.classList.toggle("on", x === b));
    show();
  }));

  show();
</script>
</body>
</html>
