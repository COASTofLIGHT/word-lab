<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Sandwich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --focus: #0B62A4;
    --panel: #F9FBFB;
    --line: rgba(16, 48, 58, 0.14);
    --bread: #F2D9A6;   /* sand: the start and end slices */
    --crust: #DDB677;   /* toasted edge on the slices */
    --filling: #C7DE9F; /* leaf green: the middle of the word */
    --lilac: #C9C3EA;   /* Start or end? tile */
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --big: "Atkinson Hyperlegible", var(--font);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--mist); color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 960px; margin: 0 auto;
    padding: clamp(1rem, 3vw, 2rem);
    display: flex; flex-direction: column; gap: 0.8rem;
  }
  button { font-family: var(--font); color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  .back { align-self: flex-start; color: var(--ink-soft); font-size: 0.95rem; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 3rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .hint { margin: 0.35rem 0 0; color: var(--ink-soft); font-size: 1.05rem; min-height: 1.4em; }

  /* Segmented pickers */
  .row { display: flex; flex-wrap: wrap; gap: 0.6rem 1.6rem; align-items: center; }
  fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  legend { float: left; margin-right: 8px; color: var(--ink-soft); font-size: 0.95rem; }
  .seg { position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: inline-block; padding: 8px 15px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 1rem;
  }
  .seg input:checked + span { background: var(--ink); color: var(--mist); border-color: var(--ink); }
  .seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }
  .modes .seg span { font-size: 1.05rem; font-weight: 700; padding: 10px 18px; }

  section[hidden] { display: none; }
  section { display: flex; flex-direction: column; gap: 0.8rem; }

  .context {
    margin: 0; font-size: clamp(1.2rem, 2.6vw, 1.6rem); font-weight: 700; text-align: center;
  }

  /* Big chunk tiles */
  .chunk {
    font-family: var(--big); font-weight: 700;
    font-size: clamp(3rem, 11vw, 7.5rem); line-height: 1;
    border-radius: 1.1rem; padding: 0.35em 0.45em;
    display: grid; place-items: center; text-align: center;
    overflow-wrap: anywhere;
  }
  .chunk.start, .chunk.end { background: var(--bread); box-shadow: inset 0 0 0 4px var(--crust); }
  .chunk.any { background: var(--lilac); }
  .chunk.off { background: var(--panel); color: var(--line); border: 3px dashed var(--line); }

  .build {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: clamp(0.4rem, 2vw, 1rem);
    align-items: stretch; min-height: clamp(140px, 28vh, 300px);
  }
  .gap {
    font-family: var(--big); font-weight: 700; font-size: clamp(2.4rem, 8vw, 5rem);
    color: var(--ink); display: grid; place-items: center; letter-spacing: 0.05em;
    background: var(--filling); border-radius: 1.1rem; padding: 0 0.3em;
  }

  /* Start or end? */

  .solo { min-height: clamp(140px, 28vh, 300px); }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(0.6rem, 2vw, 1.1rem); }
  .side {
    border: 0; cursor: pointer; border-radius: 0.9rem; min-height: 64px;
    font-size: 1.5rem; font-weight: 800;
  }
  .side.start, .side.end { background: var(--bread); box-shadow: inset 0 0 0 3px var(--crust); }
  .side:hover:not(:disabled) { filter: brightness(0.96); }
  .side:disabled { cursor: default; }
  .side.right { box-shadow: inset 0 0 0 6px var(--ink); }
  .side.right, .side.wrong { transition: opacity 150ms; }
  .side.wrong { opacity: 0.45; }

  .result { margin: 0; text-align: center; font-size: clamp(1.1rem, 2.4vw, 1.35rem); min-height: 2.6em; }
  #bWord { min-height: 2.8rem; display: grid; place-items: center; }

  .controls { display: flex; gap: 0.8rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .next {
    border: 0; cursor: pointer; border-radius: 0.9rem; background: var(--ink); color: var(--mist);
    font-size: 1.4rem; font-weight: 800; padding: 12px 34px; min-height: 56px;
  }
  .next:hover { background: #1B4652; }
  .buttons { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: flex-end; }
  .show {
    border: 2px solid var(--ink); cursor: pointer; border-radius: 0.9rem; background: var(--panel);
    font-size: 1.2rem; font-weight: 700; padding: 10px 22px; min-height: 56px;
  }
  .show:hover { background: #fff; }
  #bWord b { font-family: var(--big); font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: 0.01em; }
  #bWord .s, #bWord .e { background: var(--bread); border-radius: 0.3em; padding: 0 0.08em; }
  #bWord .m { background: var(--filling); border-radius: 0.3em; padding: 0 0.04em; }
  .score { color: var(--ink-soft); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .score b { color: var(--ink); }

  footer { color: var(--ink-soft); font-size: 0.85rem; }

  @media (max-width: 520px) {
    .build { grid-template-columns: 1fr; grid-template-rows: auto auto auto; min-height: 0; }
    .gap { font-size: 2rem; }
    .chunk { font-size: clamp(2.6rem, 16vw, 4rem); }
    .solo { min-height: 120px; }
  }
</style>
</head>
<body>
<main>
  <a class="back" href="./">&larr; Word Lab</a>

  <header>
    <h1>Word Sandwich</h1>
    <p class="hint" id="hint"></p>
  </header>

  <fieldset class="modes">
    <label class="seg"><input type="radio" name="mode" value="build" checked><span>Build a word</span></label>
    <label class="seg"><input type="radio" name="mode" value="position"><span>Start or end?</span></label>
  </fieldset>

  <!-- 1. Build a word -->
  <section id="build">
    <div class="row">
      <fieldset>
        <legend>Show</legend>
        <label class="seg"><input type="radio" name="parts" value="both" checked><span>Start and end</span></label>
        <label class="seg"><input type="radio" name="parts" value="start"><span>Start only</span></label>
        <label class="seg"><input type="radio" name="parts" value="end"><span>End only</span></label>
      </fieldset>
      <fieldset>
        <legend>Level</legend>
        <label class="seg"><input type="radio" name="len" value="easy" checked><span>Easy</span></label>
        <label class="seg"><input type="radio" name="len" value="medium"><span>Medium</span></label>
        <label class="seg"><input type="radio" name="len" value="hard"><span>Hard</span></label>
      </fieldset>
    </div>
    <div class="build">
      <div class="chunk start" id="bStart"></div>
      <div class="gap" aria-hidden="true">…</div>
      <div class="chunk end" id="bEnd"></div>
    </div>
    <div class="buttons">
      <button class="show" type="button" id="bShow">Show a word</button>
      <button class="next" type="button" id="bNext">Next</button>
    </div>
    <p class="result" id="bWord" aria-live="polite"></p>
  </section>

  <!-- 2. Start or end? -->
  <section id="position" hidden>
    <div class="chunk any solo" id="pChunk"></div>
    <div class="sides">
      <button class="side start" type="button" data-side="start">Start</button>
      <button class="side end" type="button" data-side="end">End</button>
    </div>
    <p class="result" id="pResult"></p>
    <div class="controls">
      <span class="score">Score <b id="pScore">0</b> / <b id="pTotal">0</b></span>
      <button class="next" type="button" id="pNext">Next</button>
    </div>
  </section>

  <footer>Data: the Scrabble dictionary, from a chart by Neil Kaye (@neilrkaye). Percentages are the share of all words in that dictionary, including plurals and other forms.</footer>
</main>

y"],["str","ing","streaming striking strengthening struggling"],["str","ers","strangers strollers"],["str","ies","strategies"],["str","est","strongest"],["str","ent","stringent"],["str","ling","struggling"],["imp","ing","improving implementing importing imposing"],["imp","ers","importers"],["imp","ies","implies"],["imp","ess","impress"],["imp","ion","implementation impression implication"],["imp","ble","impossible"],["imp","ent","improvement implement impairment"],["imp","tion","implementation implication"],["imp","ation","implementation implication"],["imp","ments","improvements implements"],["imp","ative","imperative"],["over","ing","overwhelming overlooking overlapping overcoming"],["anti","ion","anticipation"],["anti","ate","anticipate"],["anti","tic","antibiotic"],["anti","tion","anticipation"],["anti","ation","anticipation"],["poly","ers","polymers"],["fore","ing","forecasting foregoing"],["fore","ers","foreigners"],["auto","ion","automation"],["auto","ous","autonomous"],["auto","ate","automate"],["auto","tic","automatic"],["auto","tion","automation"],["auto","ally","automatically"],["auto","ation","automation"],["auto","cally","automatically"],["post","ate","postgraduate"],["inter","ing","interesting interpreting interacting interviewing"],["inter","ers","interpreters"],["inter","ion","interaction interpretation intervention intersection"],["inter","ate","intermediate interstate"],["inter","ity","interoperability"],["inter","ent","intermittent"],["inter","tion","interaction interpretation intervention intersection"],["inter","ally","internationally internally"],["inter","ation","interpretation"],["inter","ingly","interestingly"],["super","ing","supervising"],["super","ion","supervision superannuation"],["super","ent","superintendent"],["super","tion","superannuation"],["super","ation","superannuation"],["under","ing","understanding underlying undertaking undergoing"],["under","ble","understandable"],["under","ate","undergraduate"],["under","able","understandable"],["trans","ing","transferring transforming transporting transmitting"],["trans","ers","transfers transformers"],["trans","ion","transportation translation transmission transaction"],["trans","ble","transferable"],["trans","ate","translate"],["trans","ent","transparent transient"],["trans","tion","transportation translation transaction transition"],["trans","able","transferable"],["trans","ation","transportation translation transformation transplantation"],["micro","ology","microbiology"],["photo","ers","photographers"],["multi","ion","multifunction multiplication"],["multi","tion","multifunction multiplication"],["multi","ation","multiplication"]]};

  /* Start or end? items. Letters use both lists; affixes use the one list they appear in. */
  const POSITION = [];
  Object.keys(START[1]).forEach(l => {
    const s = START[1][l], e = END[1][l];
    if (Math.abs(s - e) >= 0.5) POSITION.push({ text: l, start: s, end: e });
  });
  ["dis","con","pre","pro","mis","sub","non"].forEach(t => POSITION.push({ text: t, start: START[3][t] }));
  ["over","anti","mono","poly","fore","auto","post"].forEach(t => POSITION.push({ text: t, start: START[4][t] }));
  ["inter","super","under","trans","micro","hyper","multi"].forEach(t => POSITION.push({ text: t, start: START[5][t] }));
  ["re","un"].forEach(t => POSITION.push({ text: t, start: START[2][t] }));
  ["ed","ly"].forEach(t => POSITION.push({ text: t, end: END[2][t] }));
  ["ing","ous","ity","ist","est","ble","ies"].forEach(t => POSITION.push({ text: t, end: END[3][t] }));
  ["ness","tion","able","ally","ical","isms"].forEach(t => POSITION.push({ text: t, end: END[4][t] }));
  ["ation","ments","ology","ative","ously"].forEach(t => POSITION.push({ text: t, end: END[5][t] }));

  /* ---------- Helpers ---------- */
  const $ = id => document.getElementById(id);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const val = name => document.querySelector(`input[name="${name}"]:checked`).value;
  const pct = n => (n === 0 ? "under 0.1" : n) + "%";
  function shuffledBag(items) {
    let bag = [];
    return () => {
      if (!bag.length) bag = items.slice().sort(() => Math.random() - 0.5);
      return bag.pop();
    };
  }

  const HINTS = {
    build: "Make a word that starts and ends with these letters.",
    position: "Do these letters come at the start or the end of more English words?"
  };

  /* ---------- Mode switching ---------- */
  function setMode(m) {
    ["build","position"].forEach(s => $(s).hidden = s !== m);
    $("hint").textContent = HINTS[m];
  }
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", () => setMode(val("mode"))));

  /* ---------- 1. Build a word ---------- */
  let bPair = null, bShown = 0, bExamples = [];
  function nextBuild() {
    const parts = val("parts"), level = val("len");
    let pr;
    do { pr = pick(PAIRS[level]); } while (bPair && pr[0] === bPair[0] && pr[1] === bPair[1]);
    bPair = pr;
    const [s, e] = pr;
    const showS = parts !== "end", showE = parts !== "start";
    $("bStart").textContent = showS ? s : "?";
    $("bEnd").textContent = showE ? e : "?";
    $("bStart").className = "chunk " + (showS ? "start" : "off");
    $("bEnd").className = "chunk " + (showE ? "end" : "off");
    /* Examples: for one-sided rounds, gather words from every pair with that start or end */
    if (parts === "both") bExamples = pr[2].split(" ");
    else {
      const seen = new Set();
      PAIRS[level].forEach(q => {
        if ((parts === "start" && q[0] === s) || (parts === "end" && q[1] === e))
          q[2].split(" ").forEach(w => seen.add(w));
      });
      bExamples = [...seen].sort(() => Math.random() - 0.5);
    }
    bShown = 0;
    $("bWord").innerHTML = "";
    $("bShow").textContent = "Show a word";
  }
  function showWord() {
    if (!bExamples.length) return;
    const w = bExamples[bShown % bExamples.length];
    const parts = val("parts"), [s, e] = bPair;
    const hasS = parts !== "end", hasE = parts !== "start";
    const a = hasS ? s.length : 0, b = hasE ? w.length - e.length : w.length;
    $("bWord").innerHTML = "<b>" +
      (a ? `<span class="s">${w.slice(0, a)}</span>` : "") +
      (b > a ? `<span class="m">${w.slice(a, b)}</span>` : "") +
      (hasE ? `<span class="e">${w.slice(b)}</span>` : "") + "</b>";
    bShown++;
    $("bShow").textContent = bExamples.length > 1 ? "Another word" : "Show a word";
  }
  $("bNext").addEventListener("click", nextBuild);
  $("bShow").addEventListener("click", showWord);
  document.querySelectorAll('input[name="parts"], input[name="len"]').forEach(r =>
    r.addEventListener("change", nextBuild));

  /* ---------- 2. Start or end? ---------- */
  const nextItem = shuffledBag(POSITION);
  let pItem = null, pDone = false, pScore = 0, pTotal = 0;
  const pSides = document.querySelectorAll(".side");
  function nextPosition() {
    pItem = nextItem();
    pDone = false;
    $("pChunk").textContent = pItem.text;
    $("pResult").textContent = "";
    pSides.forEach(b => { b.disabled = false; b.classList.remove("right", "wrong"); });
  }
  function answerOf(item) {
    if (item.start !== undefined && item.end !== undefined) return item.start > item.end ? "start" : "end";
    return item.start !== undefined ? "start" : "end";
  }
  function revealPosition(chosen) {
    if (pDone) return;
    pDone = true;
    const ans = answerOf(pItem);
    pSides.forEach(b => { b.disabled = true; b.classList.add(b.dataset.side === ans ? "right" : "wrong"); });
    const t = pItem.text;
    let msg;
    if (pItem.start !== undefined && pItem.end !== undefined) {
      msg = `${pct(pItem.start)} of words start with ${t}, and ${pct(pItem.end)} end with ${t}.`;
    } else if (ans === "start") {
      msg = `${t} is a common start: ${pct(pItem.start)} of words begin with it. Can you think of one?`;
    } else {
      msg = `${t} is a common ending: ${pct(pItem.end)} of words end with it. Can you think of one?`;
    }
    $("pResult").textContent = msg;
    pTotal++;
    if (chosen === ans) pScore++;
    $("pScore").textContent = pScore; $("pTotal").textContent = pTotal;
  }
  pSides.forEach(b => b.addEventListener("click", () => revealPosition(b.dataset.side)));
  $("pNext").addEventListener("click", nextPosition);

  /* Space or Enter on the page moves to the next round */
  document.addEventListener("keydown", e => {
    if (e.code !== "Space" && e.key !== "Enter") return;
    if (e.target instanceof HTMLButtonElement || e.target instanceof HTMLInputElement || e.target instanceof HTMLAnchorElement) return;
    e.preventDefault();
    const m = val("mode");
    if (m === "build") nextBuild();
    if (m === "position") nextPosition();
  });

  setMode("build");
  nextBuild(); nextPosition();
})();
</script>
