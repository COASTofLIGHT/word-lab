<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Wordlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --sea: #17677A;
    --sea-deep: #124F5E;
    --focus: #0B62A4;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.25rem);
  }

  .back {
    display: inline-block;
    margin-bottom: 0.5rem;
    color: var(--ink-soft);
    font-size: 0.9rem;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header h1 {
    margin: 0;
    font-size: clamp(1.7rem, 3.2vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  header p {
    margin: 0.35rem 0 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin: 1.5rem 0 1.25rem;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.75rem;
  }

  .group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem 0.9rem;
  }

  .group-label { font-weight: 600; }

  .choices { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  .choices label { position: relative; display: block; }

  .choices input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .choices span {
    display: grid;
    place-items: center;
    min-width: 2.75rem;
    height: 2.75rem;
    padding: 0 1rem;
    border: 2px solid var(--line);
    border-radius: 0.6rem;
    font-size: 1.1rem;
    font-weight: 700;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }

  .choices input:not(:checked):hover + span { border-color: var(--ink); }

  .choices input:checked + span {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--mist);
  }

  .choices input:focus-visible + span {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .note { color: var(--ink-soft); font-size: 0.95rem; }

  .primary {
    height: 2.75rem;
    padding: 0 1.6rem;
    border: 0;
    border-radius: 0.6rem;
    background: var(--sea);
    color: #fff;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  .primary:hover { background: var(--sea-deep); }
  .primary:active { transform: translateY(1px); }
  .primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* Word tiles */
  .grid {
    --cols: 3;
    --rows: 1;
    --gap: clamp(0.6rem, 1.6vw, 1.1rem);
    --chrome: 24rem;
    --h: clamp(8.5rem, calc((100vh - var(--chrome) - (var(--rows) - 1) * var(--gap)) / var(--rows)), 36rem);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--gap);
  }

  @supports (height: 100svh) {
    .grid {
      --h: clamp(8.5rem, calc((100svh - var(--chrome) - (var(--rows) - 1) * var(--gap)) / var(--rows)), 36rem);
    }
  }

  .tile {
    position: relative;
    display: flex;
    align-items: flex-end;
    flex: 0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));
    min-width: 0;
    height: var(--h);
    padding: clamp(0.9rem, 2vw, 1.6rem);
    border: 0;
    border-radius: 0.9rem;
    overflow: hidden;
    background: var(--c);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tile:hover { filter: brightness(0.96); }
  .tile:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  .swap {
    position: absolute;
    top: 0.85rem;
    left: 1.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .tile:hover .swap,
  .tile:focus-visible .swap { opacity: 0.7; }

  .text { display: block; width: 100%; }

  .word {
    display: block;
    width: 100%;
    font-size: 4rem;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-wrap: balance;
    overflow-wrap: normal;
    hyphens: none;
  }

  .meta {
    display: block;
    margin-top: 0.55rem;
    font-size: clamp(0.9rem, 1.4vw, 1.15rem);
    font-weight: 500;
    line-height: 1.25;
    white-space: pre-line;
    opacity: 0.8;
  }
  .meta:empty { display: none; }

  @keyframes settle {
    from { opacity: 0; transform: translateY(0.4rem); }
    to   { opacity: 1; transform: none; }
  }
  .text.fresh { animation: settle 0.22s ease-out; }

  .hint {
    margin: 1.25rem 0 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 640px) {
    .grid { --chrome: 32rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .text.fresh { animation: none; }
    .choices span,
    .swap { transition: none; }
  }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="https://coastoflight.github.io/word-lab.html">&larr; Word Lab</a>

  <header>
    <h1>A1 wordlist</h1>
    <p>Random words from the Cambridge Starters, Movers and Flyers lists.</p>
  </header>

  <div class="controls">
    <div class="row">
      <div class="group" role="radiogroup" aria-labelledby="count-label">
        <span class="group-label" id="count-label">How many words?</span>
        <div class="choices" id="count-options"></div>
      </div>
      <button type="button" class="primary" id="new-words">New words</button>
    </div>

    <div class="row">
      <div class="group" role="group" aria-labelledby="type-label">
        <span class="group-label" id="type-label">Word type</span>
        <div class="choices" id="type-options">
          <label><input type="checkbox" value="noun"><span>Nouns</span></label>
          <label><input type="checkbox" value="verb"><span>Verbs</span></label>
          <label><input type="checkbox" value="adjective"><span>Adjectives</span></label>
        </div>
        <span class="note">Leave all unticked for any word.</span>
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <p class="hint">Click a word to swap just that one. Changing the number keeps the words you already have; changing the word type picks a fresh set.</p>
  <p class="sr" role="status" id="status"></p>
</main>

  "year (n)", "yellow (adj)", "yesterday (n & adv)", "yoghurt (n)", "young (adj)", "zebra (n)", "zero (n)",

/* ---------- reading the entries ---------- */

const TYPE_NAMES = {
  "n": "noun", "v": "verb", "adj": "adjective", "adv": "adverb", "prep": "preposition",
  "conj": "conjunction", "pron": "pronoun", "det": "determiner", "exclam": "exclamation",
  "mv": "modal verb", "av": "auxiliary verb", "phr v": "phrasal verb",
  "prep phr": "prepositional phrase", "n pl": "plural noun", "unc n": "uncountable noun",
  "phrase": "phrase"
};

/* Brackets that belong to the word itself, e.g. "as well (as)", "mobile (phone)". */
const STAYS_IN_WORD = new Set(["as", "that", "not", "phone", "computer", "TV", "cm", "kg", "km", "£", "me"]);

function joinNames(names) {
  return names.length > 1
    ? names.slice(0, -1).join(", ") + " & " + names[names.length - 1]
    : names[0] || "";
}

function parseEntry(raw) {
  const groups = [];
  const head = raw.replace(/\s+\(([^)]*)\)/g, (match, inner) => {
    inner = inner.trim();
    if (STAYS_IN_WORD.has(inner)) return inner === "me" ? "(me)" : " (" + inner + ")";
    groups.push(inner);
    return "";
  }).trim();

  const tokens = [], senses = [], regions = [];
  for (const group of groups) {
    if (/^(Br|Am) Eng/.test(group)) {
      regions.push(group.replace("Br Eng", "UK").replace("Am Eng", "US"));
      continue;
    }
    const [typePart, ...rest] = group.split(" – ");
    const parts = typePart.split(/\s*[&,]\s*/);
    if (parts.every((p) => TYPE_NAMES[p])) {
      tokens.push(...parts);
      if (rest.length) senses.push(rest.join(" – "));
    } else {
      senses.push(group);
    }
  }

  const type = joinNames([...new Set(tokens)].map((t) => TYPE_NAMES[t]));
  const lines = [];
  if (type || senses.length) lines.push((type + (senses.length ? " (" + senses.join(", ") + ")" : "")).trim());
  /* Show the other-country word where there is one ("US: cookie"); otherwise just flag the country. */
  const variants = regions.filter((r) => r.includes(":"));
  if (variants.length) lines.push(variants.join(", "));
  else if (regions.length) lines.push(regions.map((r) => r + " English").join(", "));

  const kinds = [];
  if (tokens.some((t) => t === "n" || t === "n pl" || t === "unc n")) kinds.push("noun");
  if (tokens.some((t) => t === "v" || t === "phr v")) kinds.push("verb");
  if (tokens.includes("adj")) kinds.push("adjective");

  return { head, type, meta: lines.join("\n"), kinds };
}

const ENTRIES = RAW.map(parseEntry);

/* Tile colours stay with the position, so "the green one" is always the first tile. */
const COLOURS = ["#A8D5CB", "#F2D9A6", "#F4B5A0", "#C9C3EA", "#A9CCEB", "#F0C2D3", "#C7DE9F"];
const MAX = COLOURS.length;

const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const countOptions = document.getElementById("count-options");
const typeInputs = [...document.querySelectorAll("#type-options input")];

let count = loadCount();
let pool = ENTRIES;
let shown = [];
let deck = [];

/* ---------- picking ---------- */

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function updatePool() {
  const chosen = typeInputs.filter((i) => i.checked).map((i) => i.value);
  pool = chosen.length ? ENTRIES.filter((e) => chosen.some((c) => e.kinds.includes(c))) : ENTRIES;
  deck = [];
}

/* Draws from a shuffled deck so words don't come round again until the pool has been used. */
function draw(avoid) {
  for (let pass = 0; pass < 2; pass++) {
    while (deck.length) {
      const entry = deck.pop();
      if (!avoid.includes(entry)) return entry;
    }
    deck = shuffle(pool.slice());
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function newWords() {
  const previous = shown.slice();
  const next = [];
  for (let i = 0; i < count; i++) next.push(draw(next.concat(previous)));
  shown = next;
  render();
}

function swap(index) {
  shown[index] = draw(shown);
  render();
}

function setCount(n) {
  count = n;
  while (shown.length < count) shown.push(draw(shown));
  shown.length = count;
  saveCount();
  syncRadios();
  render();
}

/* ---------- storage ---------- */

function loadCount() {
  try {
    const value = parseInt(localStorage.getItem("a1wordlist.count"), 10);
    if (value >= 1 && value <= MAX) return value;
  } catch (e) { /* storage unavailable */ }
  return 3;
}

function saveCount() {
  try { localStorage.setItem("a1wordlist.count", String(count)); } catch (e) { /* ignore */ }
}

/* ---------- rendering ---------- */

function makeTile(index) {
  const tile = document.createElement("button");
  tile.type = "button";
  tile.className = "tile";
  tile.style.setProperty("--c", COLOURS[index]);
  tile.innerHTML =
    '<span class="swap" aria-hidden="true">Swap</span>' +
    '<span class="text"><span class="word"></span><span class="meta"></span></span>';
  tile.addEventListener("click", () => swap([...grid.children].indexOf(tile)));
  return tile;
}

function render() {
  while (grid.children.length < shown.length) grid.appendChild(makeTile(grid.children.length));
  while (grid.children.length > shown.length) grid.lastElementChild.remove();

  [...grid.children].forEach((tile, i) => {
    const entry = shown[i];
    if (tile.entry === entry) return;
    tile.entry = entry;

    /* A zero-width space after "/" lets long pairs like "centimetre/centimeter" wrap. */
    tile.querySelector(".word").textContent = entry.head.replace(/\//g, "/\u200B");
    tile.querySelector(".meta").textContent = entry.meta;
    tile.setAttribute("aria-label", entry.head + (entry.type ? ", " + entry.type : "") + ", click to swap");

    const text = tile.querySelector(".text");
    text.classList.remove("fresh");
    void text.offsetWidth;
    text.classList.add("fresh");
  });

  layout();
  statusEl.textContent = "Words: " + shown.map((e) => e.head + (e.type ? " (" + e.type + ")" : "")).join(", ");
}

function layout() {
  const n = shown.length;
  const w = window.innerWidth;
  let cols;
  if (w < 640) cols = Math.min(n, 2);
  else if (w < 960) cols = n <= 3 ? n : (n === 7 ? 4 : (n === 4 ? 2 : 3));
  else cols = { 1: 1, 2: 2, 3: 3, 4: 4, 5: 3, 6: 3, 7: 4 }[n];

  grid.style.setProperty("--cols", cols);
  grid.style.setProperty("--rows", Math.ceil(n / cols));
  fit();
}

/* One shared size for every word, shrunk tile-by-tile when a long word or phrase wouldn't fit. */
function fit() {
  const first = grid.firstElementChild;
  if (!first) return;
  const style = getComputedStyle(first);
  const innerW = first.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const innerH = first.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  const base = Math.max(22, Math.min(innerH * 0.3, innerW * 0.24, 170));

  grid.querySelectorAll(".tile").forEach((tile) => {
    const word = tile.querySelector(".word");
    const text = tile.querySelector(".text");
    let size = base;
    word.style.fontSize = size + "px";
    let guard = 0;
    while (guard++ < 60 && size > 18 &&
           (word.scrollWidth > word.clientWidth + 1 || text.offsetHeight > innerH + 1)) {
      size *= 0.94;
      word.style.fontSize = size + "px";
    }
  });
}

/* ---------- controls ---------- */

for (let n = 1; n <= MAX; n++) {
  const label = document.createElement("label");
  label.innerHTML = '<input type="radio" name="count" value="' + n + '"><span>' + n + "</span>";
  label.querySelector("input").addEventListener("change", () => setCount(n));
  countOptions.appendChild(label);
}

function syncRadios() {
  countOptions.querySelectorAll("input").forEach((input) => {
    input.checked = Number(input.value) === count;
  });
}

typeInputs.forEach((input) => input.addEventListener("change", () => {
  updatePool();
  newWords();
}));

document.getElementById("new-words").addEventListener("click", newWords);

/* Keys: 1–7 change the number, N picks new words. */
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (/^[1-7]$/.test(event.key)) setCount(Number(event.key));
  else if (event.key === "n" || event.key === "N") newWords();
});

let frame;
window.addEventListener("resize", () => {
  cancelAnimationFrame(frame);
  frame = requestAnimationFrame(layout);
});

if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

/* ---------- start ---------- */

syncRadios();
newWords();
</script>
