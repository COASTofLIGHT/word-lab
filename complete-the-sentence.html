<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete the Sentence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --paper: #FFFFFF;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --sea: #17677A;
    --sea-deep: #124F5E;
    --focus: #0B62A4;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    /* Level colours, as in Word Lab */
    --a1: #F2D9A6;  /* sand yellow */
    --a2: #F4B5A0;  /* coral orange */
    --b1: #A9CCEB;  /* sky blue */
    --b2: #A8D5CB;  /* sea green */
    /* Starters: the box takes the colour of the level */
    --level: var(--a2);
    /* Because But So */
    --board: #F2D9A6;
    --because: #A8D5CB;
    --but: #F4B5A0;
    --so: #A9CCEB;
  }

  *, *::before, *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 1300px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: clamp(0.85rem, 2.6vw, 2rem);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Title, tabs and the way back ---------- */

  .top {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    column-gap: clamp(1rem, 2.5vw, 2rem);
  }

  .top h1 {
    margin: 0 0 0.6rem;
    font-size: clamp(1.4rem, 2.8vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .back {
    margin: 0 0 0.75rem auto;
    color: var(--ink-soft);
    font-size: 0.9rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Tabs: the chosen one joins on to the frame underneath. */
  .tabs { display: flex; gap: 0.2rem; }

  .tab {
    height: 2.75rem;
    padding: 0 1.15rem;
    border: 0;
    border-radius: 0.7rem 0.7rem 0 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.55); color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--paper); color: var(--ink); }
  .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* ---------- The frame: one game at a time ---------- */

  .frame {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(0.7rem, 1.6vw, 1.1rem);
    border-radius: 0.9rem;
    background: var(--paper);
  }

  .game {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(0.55rem, 1.5vh, 0.9rem);
  }

  .intro {
    flex: 0 0 auto;
    margin: 0;
    padding: 0 0.15rem;
    color: var(--ink-soft);
    font-size: clamp(1rem, 1.9vw, 1.3rem);
    line-height: 1.3;
  }

  .controls {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
  }

  .btn, .btn-primary {
    height: 2.6rem;
    padding: 0 1.3rem;
    border-radius: 0.6rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn {
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--line);
  }
  .btn:hover { border-color: var(--ink); }
  .btn-primary {
    min-width: 9.5rem;
    background: var(--sea);
    color: #fff;
    border: 0;
  }
  .btn-primary:hover { background: var(--sea-deep); }
  .btn:active, .btn-primary:active { transform: translateY(1px); }
  .btn:focus-visible, .btn-primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .push { margin-left: auto; }

  .count {
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* Switches: level and twist */
  .pick { display: inline-flex; align-items: center; gap: 0.5rem; }
  .pick-label { color: var(--ink-soft); font-size: 0.9rem; font-weight: 600; }
  .switch {
    display: inline-flex;
    height: 2.6rem;
    border: 2px solid var(--line);
    border-radius: 0.6rem;
    overflow: hidden;
  }
  .switch button {
    padding: 0 0.95rem;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .switch button.on { background: var(--ink); color: #fff; }
  .switch button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* ---------- Starters ---------- */

  .box {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.4rem, 4vw, 3rem);
    border: 0;
    border-radius: 0.7rem;
    background: var(--level);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color 250ms ease;
  }
  .box:hover { filter: brightness(0.98); }
  .box:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .box .count {
    position: absolute;
    top: 1rem;
    right: 1.3rem;
    color: var(--ink);
    font-size: 0.85rem;
    opacity: 0.55;
  }
  .content { display: block; transition: opacity 300ms ease; }
  .content.fading { opacity: 0; }
  .sentence {
    display: block;
    font-size: clamp(1.8rem, min(5vw, 8vh), 4.2rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .conn {
    display: inline-block;
    margin-left: 0.1em;
    padding: 0 0.3em;
    border-radius: 0.35em;
    background: var(--ink);
    color: var(--mist);
  }
  .word {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: clamp(1rem, 3vh, 2rem);
    font-size: clamp(1.05rem, 2.2vw, 1.35rem);
  }
  .word b {
    padding: 0.2em 0.6em;
    border-radius: 0.6rem;
    background: var(--paper);
    font-size: clamp(1.4rem, min(3.4vw, 5.5vh), 2.1rem);
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  /* ---------- Because But So ---------- */

  .board {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(1rem, 3vw, 2.5rem);
    border-radius: 0.7rem;
    background: var(--board);
  }
  .stem-wrap { flex: 1; display: flex; align-items: center; min-height: 0; }
  .stem {
    margin: 0;
    font-size: clamp(1.8rem, min(5vw, 8vh), 4.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-wrap: balance;
  }
  .stem .join {
    display: inline-block;
    padding: 0 0.3em;
    border-radius: 0.35em;
    background: var(--c);
    animation: pop 0.35s ease-out;
  }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } }

  .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(0.6rem, 1.6vw, 1.1rem); }
  .link {
    padding: clamp(0.7rem, 2.5vh, 1.6rem) 0.5rem;
    border-radius: 0.7rem;
    background: var(--c);
    text-align: center;
    font-size: clamp(1.4rem, min(3.2vw, 5vh), 2.6rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    opacity: 0.3;
    transform: scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
  }
  .link.long { font-size: clamp(1rem, min(2vw, 3.4vh), 1.7rem); }
  .link.on { opacity: 1; transform: scale(1); box-shadow: inset 0 0 0 3px var(--ink); }
  .because { --c: var(--because); }
  .but { --c: var(--but); }
  .so { --c: var(--so); }

  /* ---------- Two to Five ---------- */

  #two-game {
    --panel: #F9FBFB;
    --hair: rgba(16, 48, 58, 0.14);
    --two-level: var(--a2);   /* the board takes the colour of the level */
    overflow-y: auto;         /* with lots of teams on a small screen, the game scrolls rather than hiding anything */
  }
  #two-game button, #two-game input { font-family: var(--font); }
  #two-game button { cursor: pointer; }
  #two-game button:focus-visible, #two-game input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #two-game .btn:disabled { opacity: 0.35; cursor: default; }
  #two-game .btn:disabled:hover { border-color: var(--line); }

  /* The board */
  .two-board {
    flex: 1 0 auto; background: var(--two-level); border-radius: 0.7rem;
    padding: clamp(1rem, 3vw, 2.5rem); display: flex; flex-direction: column;
    transition: background-color 250ms ease;
  }
  .two-board.a2 { --two-level: var(--a2); }
  .two-board.b1 { --two-level: var(--b1); }
  .two-board.b2 { --two-level: var(--b2); }

  #two-game .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  #two-game .prompt { margin: 0; font-size: clamp(1rem, 1.6vw, 1.3rem); font-weight: 600; line-height: 1.3; }

  /* The four numbers: all lit when any length is allowed, one lit in Exactly mode */
  #two-game .nums { display: flex; gap: 0.4rem; flex: none; }
  #two-game .num {
    width: clamp(2.2rem, 4.2vw, 3.4rem); aspect-ratio: 1; border-radius: 0.6rem;
    display: grid; place-items: center; background: var(--panel);
    font-size: clamp(1.2rem, 2.4vw, 2rem); font-weight: 800; font-variant-numeric: tabular-nums;
    transition: opacity 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
  }
  #two-game .num.off { opacity: 0.3; transform: scale(0.9); }
  #two-game .num.ring { box-shadow: inset 0 0 0 3px var(--ink); }

  .two-stage { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 0.6rem; padding: 0.6rem 0; }
  #two-game .sentence {
    margin: 0; font-size: clamp(1.7rem, min(4.6vw, 7.5vh), 4rem); font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.3; text-wrap: balance;
  }
  /* The gap: one slot per word. Solid slots must be filled, dashed slots are optional. */
  #two-game .gap { display: inline-flex; gap: 0.22em; vertical-align: baseline; white-space: nowrap; margin: 0 0.1em; }
  #two-game .slot { display: inline-block; width: 1.5em; height: 0.75em; border-bottom: 0.09em solid var(--ink); }
  #two-game .slot.maybe { border-bottom-style: dashed; opacity: 0.45; }
  #two-game .ex {
    display: inline-block; background: var(--panel); border-radius: 0.3em;
    padding: 0 0.22em; margin: 0.06em 0.05em; animation: two-pop 0.3s ease-out;
  }
  @keyframes two-pop { from { transform: scale(0.85); opacity: 0; } }
  #two-game .worth { margin: 0; min-height: 1.4em; font-size: clamp(1rem, 1.6vw, 1.3rem); font-weight: 600; }

  /* Round result */
  #two-game .result h2 { margin: 0 0 0.8rem; font-size: clamp(1.6rem, min(4vw, 6vh), 3.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
  #two-game .result ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.4rem; max-width: 44rem; }
  #two-game .result li {
    display: grid; grid-template-columns: 1fr auto auto; gap: 1.2rem; align-items: baseline;
    background: var(--panel); border-radius: 0.6rem; padding: 0.45rem 0.9rem;
    font-size: clamp(1.1rem, 2vw, 1.6rem); font-weight: 700;
  }
  #two-game .result li span { font-variant-numeric: tabular-nums; }
  #two-game .result li .sub { font-weight: 600; color: var(--ink-soft); font-size: 0.8em; }

  /* Teams */
  #two-game .scores { flex: 0 0 auto; display: flex; gap: 0.6rem; align-items: stretch; flex-wrap: wrap; }
  #two-game .teams { flex: 1; min-width: min(100%, 18rem); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 0.6rem; }
  #two-game .team {
    display: flex; align-items: center; gap: 0.7rem;
    background: var(--panel); border: 1px solid var(--hair); border-radius: 0.9rem; padding: 0.45rem 0.7rem;
  }
  #two-game .team .name {
    flex: 1; min-width: 6rem; width: 100%; color: var(--ink); font-size: 1.05rem; font-weight: 700;
    border: 0; border-bottom: 2px dashed transparent; background: transparent; padding: 0.1em 0;
  }
  #two-game .team .name:hover, #two-game .team .name:focus { border-bottom-color: var(--ink-soft); outline: none; }
  #two-game .team .total { font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; line-height: 1; }
  #two-game .pts { display: flex; gap: 0.3rem; }
  #two-game .pt {
    width: 2.3rem; height: 2.3rem; border-radius: 0.55rem; border: 2px solid var(--ink);
    background: transparent; color: var(--ink); font-size: 1.05rem; font-weight: 700; padding: 0;
  }
  #two-game .pt.on { background: var(--ink); color: var(--mist); }
  #two-game .pt:disabled { opacity: 0.2; cursor: default; }
  #two-game .tools { display: flex; flex-direction: column; justify-content: center; gap: 0.25rem; }
  #two-game .tool { border: 0; background: transparent; color: var(--ink-soft); font-size: 0.9rem; font-weight: 600; text-align: left; padding: 0.1rem 0.3rem; border-radius: 0.3rem; }
  #two-game .tool:hover { color: var(--ink); text-decoration: underline; }
  #two-game .tool:disabled { opacity: 0.35; cursor: default; text-decoration: none; }

  /* ---------- What is it not? ---------- */

  /* The board takes the colour of the level: the word on the left, the sentences to finish on the right. */
  .not-board {
    --not-level: var(--a1);
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: clamp(0.6rem, 1.8vw, 1.3rem);
    padding: clamp(0.8rem, 2.4vw, 2rem);
    border-radius: 0.7rem;
    background: var(--not-level);
    transition: background-color 250ms ease;
  }
  .not-board.a1 { --not-level: var(--a1); }
  .not-board.a2 { --not-level: var(--a2); }
  .not-board.b1 { --not-level: var(--b1); }
  .not-board.b2 { --not-level: var(--b2); }

  .not-word {
    margin: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: clamp(0.7rem, 2vw, 1.5rem);
    border-radius: 0.7rem;
    background: var(--paper);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-align: center;
    overflow: hidden;
  }
  .not-word span { display: inline-block; white-space: nowrap; font-size: var(--fs, 4rem); }
  .not-word.fresh span { animation: pop 0.3s ease-out; }

  .not-stems {
    min-height: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: clamp(0.35rem, 1.2vh, 0.65rem);
    font-size: clamp(1.25rem, min(3vw, 4.8vh), 2.5rem);   /* made smaller by the script if a long sentence needs it */
  }
  .not-stems li {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 0.35em;
    padding: 0 0.7em;
    border-radius: 0.6rem;
    background: var(--paper);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .not-stems li b { font-weight: 700; white-space: nowrap; }
  .not-stems li b.tight { margin-left: -0.25em; }   /* a comma sits close to the gap before it */
  /* The lines to write on. A sentence can have one gap or two; the last one is the longest. */
  .not-stems li i { flex: 1 1 2.4em; min-width: 2.4em; height: 0.75em; border-bottom: 0.09em dashed var(--ink); opacity: 0.45; }
  .not-stems li i:last-child { flex-grow: 2; }

  /* ---------- Smaller screens ---------- */

  /* The tabs drop to their own row, flush with the frame's left edge. */
  @media (max-width: 1080px) {
    .tabs { order: 3; flex-basis: 100%; }
    .back { margin-bottom: 0.6rem; }
    .frame { border-top-left-radius: 0; }
  }

  /* Phones: everything stacks and the page scrolls if it needs to. */
  @media (max-width: 720px) {
    html, body { height: auto; overflow: auto; }
    .page { height: auto; min-height: 100vh; min-height: 100dvh; }
    .box { min-height: 18rem; }
    .board { min-height: 22rem; }
    .push { margin-left: 0; }
    .switch button { padding: 0 0.55rem; font-size: 0.9rem; }
    .pick { max-width: 100%; }
    /* Four tabs on a narrow screen: smaller, and they slide sideways if they still don't fit. */
    .tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 0 0.6rem; font-size: 0.88rem; }
    #two-game { overflow: visible; }
    .two-stage { min-height: 38vh; padding: 1.2rem 0; }
    #two-game .team { flex-wrap: wrap; }
    #two-game .team .name { flex-basis: 100%; }
    #two-game .team .total { margin-left: auto; }
    #two-game .tools { flex-direction: row; flex-wrap: wrap; }
    .not-board { grid-template-columns: 1fr; }
    .not-word { min-height: 8rem; }
    .not-stems li { flex: 0 0 auto; flex-wrap: wrap; row-gap: 0.5rem; min-height: 3.2rem; padding-block: 0.6rem; }
    .not-stems li i { min-width: 3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .content, .box, .link { transition: none; }
    .stem .join { animation: none; }
    .two-board, #two-game .num { transition: none; }
    #two-game .ex { animation: none; }
    .not-board { transition: none; }
    .not-word.fresh span { animation: none; }
  }
</style>
</head>
<body>
<main class="page">

  <div class="top">
    <h1>Complete the Sentence</h1>
    <div class="tabs" role="tablist" aria-label="Games" id="tabs"></div>
    <a class="back" href="./">&larr; Word Lab</a>
  </div>

  <div class="frame">

    <!-- Starters: the start of a sentence, with an optional connector and word to use. -->
    <section class="game" id="starters-game" role="tabpanel" aria-labelledby="tab-starters">
      <p class="intro">We give you the start. You finish it your way.</p>

      <button type="button" class="box" id="box" aria-label="Show another sentence">
        <span class="count" id="starter-count"></span>
        <span class="content" id="content">
          <span class="sentence" id="sentence"></span>
          <span class="word" id="word" hidden>Use the word <b id="word-text"></b></span>
        </span>
      </button>

      <div class="controls">
        <button type="button" class="btn-primary" id="starter-next">Next</button>
        <div class="pick push">
          <span class="pick-label" id="level-label">Level</span>
          <div class="switch" id="starter-level" role="group" aria-labelledby="level-label">
            <button type="button" data-v="a1">A1</button>
            <button type="button" data-v="a2" class="on">A2</button>
            <button type="button" data-v="b1">B1</button>
            <button type="button" data-v="b2">B2</button>
          </div>
        </div>
        <div class="pick">
          <span class="pick-label" id="twist-label">Twist</span>
          <div class="switch" id="starter-twist" role="group" aria-labelledby="twist-label">
            <button type="button" data-v="none" class="on">None</button>
            <button type="button" data-v="conn">Connector</button>
            <button type="button" data-v="word">Word</button>
            <button type="button" data-v="both">Both</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Because But So: one sentence, finished three ways. -->
    <section class="game" id="bbs-game" role="tabpanel" aria-labelledby="tab-bbs" hidden>
      <p class="intro">Complete the sentence. Use the word that lights up.</p>

      <div class="board">
        <div class="stem-wrap">
          <p class="stem" id="stem"></p>
        </div>
        <div class="links" aria-hidden="true">
          <div class="link because" data-j="reason"></div>
          <div class="link but" data-j="contrast"></div>
          <div class="link so" data-j="result"></div>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn" id="bbs-prev">Back</button>
        <button type="button" class="btn-primary" id="bbs-next">Show the word</button>
        <span class="count" id="bbs-count"></span>
        <div class="pick push">
          <span class="pick-label" id="bbs-level-label">Level</span>
          <div class="switch" id="bbs-level" role="group" aria-labelledby="bbs-level-label">
            <button type="button" data-v="a2" class="on">A2</button>
            <button type="button" data-v="b1">B1</button>
            <button type="button" data-v="b2">B2</button>

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}
/* A shuffled deck per list, so nothing repeats until everything has been shown */
const decks = {};
function draw(key, list) {
  let d = decks[key];
  if (!d || !d.cards.length) {
    const last = d ? d.last : null;
    d = decks[key] = { cards: shuffle(list.slice()), last, shown: 0 };
    if (d.cards.length > 1 && d.cards[d.cards.length - 1] === last) d.cards.unshift(d.cards.pop());
  }
  d.last = d.cards.pop();
  d.shown++;
  return d.last;
}

      const f = FUNCS[(i + cycle) % 3], opts = LINKS[lv][f];
      steps.push({ s, f, key: opts[i % opts.length] });
    });
  }
  return steps;
}

      ["We were late because ___.", "it rained", "Dad overslept again", "we missed the train", "my sister lost her keys"],
      ["I think everyone should ___ at least once.", "go camping", "try new food", "travel to another country", "sing in front of people"],
      ["He apologised for ___.", "being late", "forgetting my birthday", "breaking my new headphones", "not replying to my message"],
      ["I've been ___ for two hours.", "studying maths", "waiting for you", "trying to call you", "playing this game with friends"]
    ],
    b2: [
      ["If I'd known about the party, I ___.", "would've come", "would have come", "would have brought something", "would have invited my cousin"],
      ["Despite ___, she managed to finish the race.", "the rain", "feeling very ill", "hurting her left ankle", "having slept for three hours"],
      ["I wish I ___ when I was younger.", "had travelled", "had learnt piano", "had taken more risks", "had listened to my grandparents"],
      ["It's high time the government ___.", "took action", "listened to teenagers", "invested in public transport", "did something about climate change"],
      ["Spending too much time online can ___.", "be harmful", "affect your sleep", "make you feel lonely", "stop you seeing your friends"],
      ["By the time we arrived, ___.", "they'd gone", "everyone had left", "the film had started", "all the food had gone"],
      ["She's the kind of person who ___.", "never complains", "always tells jokes", "makes everyone feel welcome", "would help anyone in trouble"],
      ["I can't stand people who ___.", "show off", "never say thanks", "talk over other people", "are always on their phones"],
      ["Unless we ___, the problem will only get worse.", "act now", "change our habits", "start using less plastic", "all work together on it"],
      ["It's worth ___ before you make a decision.", "thinking carefully", "asking for advice", "talking to your family", "looking at all the options"],
      ["I would have passed if I ___.", "had studied", "had worked harder", "had revised the vocabulary", "had read the questions properly"],
      ["Nowadays, teenagers tend to ___.", "sleep less", "shop online more", "spend less time outdoors", "follow celebrities on social media"],
      ["Having ___, he decided to go home.", "finished work", "missed the bus", "lost all his money", "waited for over an hour"],
      ["What I love most about weekends is ___.", "sleeping in", "having no homework", "seeing all my friends", "not setting an alarm clock"],
      ["She suggested ___ instead of staying in.", "going out", "trying something new", "going for a walk", "meeting up at the beach"],
      ["He was accused of ___.", "telling lies", "copying my homework", "breaking the school rules", "taking money from the shop"],
      ["Social media has made it easier to ___.", "stay connected", "share your opinions", "find people like you", "keep in touch with friends"],
      ["I'd sooner ___ than give a speech in public.", "eat insects", "fail an exam", "clean the whole school", "walk home in the rain"],
      ["No sooner had we sat down than ___.", "it rained", "the lights failed", "the fire alarm rang", "my phone started to ring"],
      ["It's no use ___; you just have to practise.", "getting upset", "blaming your teacher", "waiting for a miracle", "hoping it will get easier"],
      ["The government ought to ___.", "do more", "protect the environment", "build more sports centres", "make public transport much cheaper"],
      ["She regrets ___.", "leaving early", "not studying languages", "selling her old guitar", "arguing with her best friend"],
      ["This time next year, I'll be ___.", "studying abroad", "living in London", "preparing for my exams", "working in my uncle's shop"],
      ["I'm not used to ___.", "waking early", "speaking in public", "eating dinner so early", "being away from my family"],
      ["The reason I was late is that ___.", "I overslept", "my alarm failed", "the roads were flooded", "I couldn't find my keys"]
    ]
  };

  const ROUND = 5;          // sentences in a round
  const MAX_TEAMS = 6;

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sum = a => a.reduce((t, v) => t + (v || 0), 0);

  // Each level has its own shuffled pile, so sentences don't repeat until the pile runs out.
  const piles = { a2: [], b1: [], b2: [] };
  function draw(lv) {
    if (!piles[lv].length) piles[lv] = shuffle(SENTENCES[lv].slice());
    return piles[lv].pop();
  }

  let twoLevel = "a2";
  let twoMode = "free";     // "free" = any length from 2 to 5, "exact" = the lit number
  let teams = [{ name: "Team 1", bank: 0 }, { name: "Team 2", bank: 0 }];
  let round = null;         // { items: [{ s, n, exact }], scores: [team][sentence] }
  let at = 0;               // 0 to 4 = sentence, 5 = round result
  let shown = 0;            // word count of the example on screen, 0 = none

  const board = $("two-board"), stage = $("two-stage"), promptEl = $("two-prompt"), teamsEl = $("two-teams");
  const nextBtn = $("two-next"), prevBtn = $("two-prev"), exBtn = $("two-example"), countEl = $("two-count");
  const nums = [...$("two-game").querySelectorAll(".num")];

  function newRound(bank) {
    if (bank && round) teams.forEach((t, i) => { t.bank += sum(round.scores[i]); });
    // The numbers for Exactly: each of 2, 3, 4, 5 once, plus one more.
    const bag = shuffle([2, 3, 4, 5, 2 + Math.floor(Math.random() * 4)]);
    round = {
      items: bag.map(n => ({ s: draw(twoLevel), n, exact: twoMode === "exact" })),
      scores: teams.map(() => Array(ROUND).fill(null))
    };
    at = 0; shown = 0;
    render();
  }

  const roundMax = () => sum(round.items.map(it => it.exact ? it.n : 5));

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderSentence() {
    const it = round.items[at];
    promptEl.textContent = it.exact
      ? `Fill the gap with exactly ${it.n} words.`
      : "Fill the gap with 2 to 5 words. One point for each word.";

    nums.forEach((d, i) => {
      const k = i + 2;
      d.classList.toggle("off", it.exact && k !== it.n);
      d.classList.toggle("ring", (it.exact && k === it.n) || shown === k);
    });

    const [before, after] = it.s[0].split("___");
    const p = el("p", "sentence");
    p.append(before);
    if (shown) {
      it.s[shown - 1].split(" ").forEach(w => { p.append(el("span", "ex", w), " "); });
      p.lastChild.remove();
    } else {
      const gap = el("span", "gap");
      const slots = it.exact ? it.n : 5, solid = it.exact ? it.n : 2;
      for (let i = 0; i < slots; i++) gap.append(el("span", i < solid ? "slot" : "slot maybe"));
      p.append(gap);
    }
    p.append(after);

    const worth = el("p", "worth", shown ? `${shown} words, so ${shown} points.` : "");
    stage.className = "two-stage";
    stage.replaceChildren(p, worth);

    exBtn.disabled = false;
    exBtn.textContent = !shown ? "Show an example" : (it.exact || shown === 5) ? "Hide the example" : "Show a longer one";
    nextBtn.textContent = at === ROUND - 1 ? "See the round result" : "Next sentence";
    prevBtn.disabled = at === 0;
    countEl.textContent = `Sentence ${at + 1} of ${ROUND}`;
  }

  function renderResult() {
    promptEl.textContent = "Round result";
    nums.forEach(d => { d.classList.add("off"); d.classList.remove("ring"); });

    const rows = teams.map((t, i) => ({ name: t.name || `Team ${i + 1}`, pts: sum(round.scores[i]), total: t.bank + sum(round.scores[i]) }))
      .sort((a, b) => b.pts - a.pts);
    const best = rows[0].pts, winners = rows.filter(r => r.pts === best).map(r => r.name);
    const headline = best === 0 ? "No points this round."
      : winners.length === 1 ? (teams.length === 1 ? `${best} points this round.` : `${winners[0]} wins the round.`)
      : `A draw between ${winners.slice(0, -1).join(", ")} and ${winners[winners.length - 1]}.`;

    const box = el("div", "result");
    const list = el("ol");
    rows.forEach(r => {
      const li = el("li");
      li.append(el("span", null, r.name), el("span", null, `${r.pts} out of ${roundMax()}`), el("span", "sub", `Total ${r.total}`));
      list.append(li);
    });
    box.append(el("h2", null, headline), list);
    stage.className = "two-stage";
    stage.replaceChildren(box);

    exBtn.disabled = true;
    exBtn.textContent = "Show an example";
    nextBtn.textContent = "Start a new round";
    prevBtn.disabled = false;
    countEl.textContent = "";
  }

  function renderTeams() {
    const it = round.items[at];
    teamsEl.replaceChildren(...teams.map((t, i) => {
      const card = el("div", "team");
      const name = el("input", "name");
      name.value = t.name; name.maxLength = 16; name.setAttribute("aria-label", `Name of team ${i + 1}`);
      name.addEventListener("input", () => { t.name = name.value; });
      const pts = el("div", "pts");
      if (it) {
        [0, 2, 3, 4, 5].forEach(v => {
          const b = el("button", "pt", v);
          b.setAttribute("aria-label", `${v} points`);
          b.classList.toggle("on", round.scores[i][at] === v);
          b.disabled = it.exact && v !== 0 && v !== it.n;
          b.addEventListener("click", () => {
            round.scores[i][at] = round.scores[i][at] === v ? null : v;
            renderTeams();
          });
          pts.append(b);
        });
      }
      card.append(name, pts, el("span", "total", t.bank + sum(round.scores[i])));
      return card;
    }));
    $("two-add-team").disabled = teams.length >= MAX_TEAMS;
    $("two-remove-team").disabled = teams.length <= 1;
  }

  function render() {
    board.className = "two-board " + twoLevel;
    if (at < ROUND) renderSentence(); else renderResult();
    renderTeams();
  }

  function forward() {
    if (at < ROUND) { at++; shown = 0; render(); } else { newRound(true); }
  }
  function back() {
    if (at > 0) { at--; shown = 0; render(); }
  }

  nextBtn.addEventListener("click", forward);
  prevBtn.addEventListener("click", back);
  exBtn.addEventListener("click", () => {
    const it = round.items[at];
    if (!it) return;
    shown = it.exact ? (shown ? 0 : it.n) : (shown === 0 ? 2 : shown === 5 ? 0 : shown + 1);
    render();
  });

  $("two-add-team").addEventListener("click", () => {
    if (teams.length >= MAX_TEAMS) return;
    teams.push({ name: `Team ${teams.length + 1}`, bank: 0 });
    round.scores.push(Array(ROUND).fill(null));
    render();
  });
  $("two-remove-team").addEventListener("click", () => {
    if (teams.length <= 1) return;
    teams.pop(); round.scores.pop();
    render();
  });
  $("two-reset").addEventListener("click", () => {
    teams.forEach(t => { t.bank = 0; });
    round.scores = teams.map(() => Array(ROUND).fill(null));
    render();
  });

  // Changing the game applies from the sentence on screen onwards.
  wireSwitch($("two-mode"), (picked) => {
    if (twoMode === picked) return;
    twoMode = picked;
    for (let i = at; i < ROUND; i++) {
      round.items[i].exact = twoMode === "exact";
      round.scores.forEach(s => { s[i] = null; });
    }
    shown = 0;
    render();
  });

  // Changing the level keeps the points so far and starts a new round.
  wireSwitch($("two-level"), (picked) => {
    if (twoLevel === picked) return;
    twoLevel = picked;
    newRound(true);
  });

  newRound(false);
  return { forward, back };   // for the arrow keys, further down
})();

/* ===============================================================
   What is it not?
   One object or animal at a time, with sentences to finish that say
   what it is not. Everything for this tab lives inside the brackets
   below, so its names can't clash with the other games.
================================================================ */

const whatIsItNot = (() => {
  /*
    Words: objects and animals, one thing each (no plurals, nothing you
    cannot count), so "A" or "An" always works in front.
    Each level uses the words of the levels below as well as its own;
    B2 has the same words as B1, with harder sentences.
    To add a word, type it into a list with a space before it.
  */
  const NOT_WORDS = {
    a1: ("cat dog fish bird horse cow sheep duck chicken frog mouse spider snake monkey elephant giraffe lion tiger " +
         "bear hippo crocodile zebra rabbit goat whale dolphin shark kangaroo parrot penguin bat bee fly snail lizard panda " +
         "ball book pen pencil ruler rubber bag chair table desk bed door window clock lamp phone computer " +
         "car bus bike train plane boat lorry kite doll robot guitar piano hat shoe sock T-shirt jacket " +
         "apple banana orange egg cake sandwich burger tree flower house box cup bottle key camera radio").split(" "),
    a2: ("camel butterfly eagle octopus turtle wolf fox deer donkey swan ant dinosaur jellyfish squirrel owl gorilla kitten puppy " +
         "umbrella suitcase backpack laptop tablet fridge cooker sofa mirror pillow blanket towel toothbrush comb wallet " +
         "ticket passport map newspaper magazine diary dictionary envelope stamp candle ladder bridge castle tent " +
         "helicopter motorbike taxi tram ship rocket skateboard drum violin ring necklace belt glove scarf boot coat sweater " +
         "knife fork spoon plate bowl glass lemon potato tomato carrot onion mushroom biscuit").split(" "),
    b1: ("hedgehog seagull lobster peacock ostrich flamingo chameleon caterpillar woodpecker crab seal goose hamster " +
         "lighthouse microwave telescope calculator hammer saucepan kettle wheelchair trolley fountain statue compass " +
         "parachute submarine tractor caravan hammock satellite microscope thermometer keyboard charger drone screwdriver " +
         "wardrobe chimney doorbell dishwasher freezer bookshelf skyscraper windmill scooter canoe trumpet flute trophy medal").split(" ")
  };
  NOT_WORDS.a2 = NOT_WORDS.a1.concat(NOT_WORDS.a2);
  NOT_WORDS.b1 = NOT_WORDS.a2.concat(NOT_WORDS.b1);
  NOT_WORDS.b2 = NOT_WORDS.b1;

  /*
    The sentences to finish. ___ is a gap: a sentence can have one or two.
    {A word} becomes "A whale", "An apple" and so on; the first sentence at
    each level uses it, so the word is named before the "It" sentences.
  */
  const NOT_STEMS = {
    a1: ["{A word} is not ___", "It does not ___", "It can't ___", "It hasn't got ___"],
    a2: ["{A word} is not ___", "It does not ___", "It can't ___", "It hasn't got ___", "It will never ___"],
    b1: ["{A word} isn't as ___ as ___", "It has never ___", "It isn't ___ enough to ___",
         "It doesn't have to ___", "It isn't used for ___", "If it could ___, it wouldn't ___"],
    b2: ["{A word} is neither ___ nor ___", "Unlike a ___, it doesn't ___", "Despite ___, it can't ___",
         "It wishes it didn't have to ___", "There's no point in ___"]
  };

  const board = $("not-board"), wordBox = $("not-word"), wordText = $("not-word-text");
  const article = (w) => /^[aeiou]/i.test(w) ? "an" : "a";

  let notLevel = "a1";
  let pile = [];        // shuffled words still to come at this level
  let seen = 0;
  let word = null;      // the word on screen (null until the tab is first opened)

  function next() {
    if (!pile.length) {
      pile = shuffle(NOT_WORDS[notLevel].slice());
      if (pile.length > 1 && pile[pile.length - 1] === word) pile.unshift(pile.pop());
      seen = 0;
    }
    word = pile.pop();
    seen++;

    const withArticle = article(word) + " " + word;
    wordText.textContent = withArticle;
    wordBox.classList.remove("fresh"); void wordBox.offsetWidth; wordBox.classList.add("fresh");

    $("not-stems").replaceChildren(...NOT_STEMS[notLevel].map((stem) => {
      const li = document.createElement("li");
      const parts = stem.replace("{A word}", withArticle.charAt(0).toUpperCase() + withArticle.slice(1)).split("___");
      parts.forEach((text, i) => {
        text = text.trim();
        if (text) {
          const b = document.createElement("b");
          b.textContent = text;
          if (text.charAt(0) === ",") b.className = "tight";
          li.append(b);
        }
        if (i < parts.length - 1) li.append(document.createElement("i"));   /* a line to write on */
      });
      return li;
    }));

    $("not-count").textContent = `${seen} / ${NOT_WORDS[notLevel].length}`;
    fit();
  }

  /* The word is as big as its box allows, and the sentences shrink a little if a long one needs it */
  function fit() {
    if ($("not-game").hidden || !word) return;
    const cs = getComputedStyle(wordBox);
    const room = wordBox.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const fs = Math.min(120, window.innerWidth * 0.09);
    wordBox.style.setProperty("--fs", fs + "px");
    const wide = wordText.offsetWidth;
    if (wide > room) wordBox.style.setProperty("--fs", Math.max(20, fs * room / wide * 0.95) + "px");

    const list = $("not-stems");
    list.style.fontSize = "";
    if (window.matchMedia("(max-width: 720px)").matches) return;   /* on a phone the sentences wrap instead */
    let size = parseFloat(getComputedStyle(list).fontSize);
    const tooBig = () => [...list.children].some((li) => li.scrollWidth > li.clientWidth + 1 || li.scrollHeight > li.clientHeight + 1);
    while (size > 14 && tooBig()) {
      size *= 0.95;
      list.style.fontSize = size + "px";
    }
  }

  $("not-next").addEventListener("click", next);
  wireSwitch($("not-level"), (picked) => {
    if (notLevel === picked) return;
    notLevel = picked;
    board.className = "not-board " + picked;
    pile = [];
    next();
  });
  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* open: called when the tab is shown. The first time, it deals a word. */
  return { next, open: () => { if (!word) next(); else fit(); } };
})();

/* ===============================================================
   The tabs
================================================================ */

const tabsEl = $("tabs");
let mode = GAMES[0].id;
try {
  const saved = localStorage.getItem("complete.mode");
  if (GAMES.some((g) => g.id === saved)) mode = saved;
} catch (e) { /* ignore */ }
const asked = new URLSearchParams(location.search).get("mode");
if (GAMES.some((g) => g.id === asked)) mode = asked;

function applyMode() {
  tabsEl.querySelectorAll(".tab").forEach((tab) => {
    const on = tab.id === "tab-" + mode;
    tab.setAttribute("aria-selected", on);
    tab.tabIndex = on ? 0 : -1;
  });
  GAMES.forEach((g) => { $(g.id + "-game").hidden = g.id !== mode; });
  if (mode === "starters") { if (!current) nextStarter(false); }
  else if (mode === "bbs") showStem();
  else if (mode === "not") whatIsItNot.open();
}

function chooseMode(id) {
  mode = id;
  try { localStorage.setItem("complete.mode", mode); } catch (e) { /* ignore */ }
  applyMode();
}

GAMES.forEach((game) => {
  const tab = document.createElement("button");
  tab.type = "button";
  tab.className = "tab";
  tab.id = "tab-" + game.id;
  tab.setAttribute("role", "tab");
  tab.setAttribute("aria-controls", game.id + "-game");
  tab.textContent = game.label;
  tab.addEventListener("click", () => chooseMode(game.id));
  tabsEl.appendChild(tab);
});

/* Left and right arrows move between the tabs when one of them has the focus. */
tabsEl.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
  const at = GAMES.findIndex((g) => g.id === mode);
  const to = GAMES[(at + (event.key === "ArrowRight" ? 1 : GAMES.length - 1)) % GAMES.length];
  chooseMode(to.id);
  $("tab-" + to.id).focus();
});

/* ---------- keyboard ----------
   Starters: Space or Enter gives a new sentence.
   Because But So: Space, Enter or the right arrow moves on; the left arrow goes back.
   Two to Five: the right arrow moves on; the left arrow goes back.
   What is it not?: Space, Enter or the right arrow gives a new word. */
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const target = event.target.closest ? event.target : document.body;
  if (target.closest(".tabs")) return;
  const press = event.code === "Space" || event.key === "Enter";
  if (press && target.closest("button, a")) return;

  if (mode === "two") {
    if (event.target.tagName === "INPUT") return;   // typing a team name
    if (event.key === "ArrowRight") twoToFive.forward();
    else if (event.key === "ArrowLeft") twoToFive.back();
  } else if (mode === "starters") {
    if (press) { event.preventDefault(); nextStarter(); }
  } else if (mode === "not") {
    if (press || event.key === "ArrowRight") { event.preventDefault(); whatIsItNot.next(); }
  } else {
    if (press || event.key === "ArrowRight") { event.preventDefault(); forward(); }
    else if (event.key === "ArrowLeft") moveStem(-1);
  }
});

applyMode();
</script>
