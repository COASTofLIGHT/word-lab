<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete the Sentence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --paper: #FFFFFF;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --sea: #17677A;
    --sea-deep: #124F5E;
    --focus: #0B62A4;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    /* Level colours, as in Word Lab */
    --a1: #F2D9A6;  /* sand yellow */
    --a2: #F4B5A0;  /* coral orange */
    --b1: #A9CCEB;  /* sky blue */
    --b2: #A8D5CB;  /* sea green */
    /* Starters: the box takes the colour of the level */
    --level: var(--a2);
    /* Because But So */
    --board: #F2D9A6;
    --because: #A8D5CB;
    --but: #F4B5A0;
    --so: #A9CCEB;
  }

  *, *::before, *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 1300px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: clamp(0.85rem, 2.6vw, 2rem);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Title, tabs and the way back ---------- */

  .top {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    column-gap: clamp(1rem, 2.5vw, 2rem);
  }

  .top h1 {
    margin: 0 0 0.6rem;
    font-size: clamp(1.4rem, 2.8vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .back {
    margin: 0 0 0.75rem auto;
    color: var(--ink-soft);
    font-size: 0.9rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Tabs: the chosen one joins on to the frame underneath. */
  .tabs { display: flex; gap: 0.2rem; }

  .tab {
    height: 2.75rem;
    padding: 0 1.15rem;
    border: 0;
    border-radius: 0.7rem 0.7rem 0 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.55); color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--paper); color: var(--ink); }
  .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* ---------- The frame: one game at a time ---------- */

  .frame {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(0.7rem, 1.6vw, 1.1rem);
    border-radius: 0.9rem;
    background: var(--paper);
  }

  .game {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(0.55rem, 1.5vh, 0.9rem);
  }

  .intro {
    flex: 0 0 auto;
    margin: 0;
    padding: 0 0.15rem;
    color: var(--ink-soft);
    font-size: clamp(1rem, 1.9vw, 1.3rem);
    line-height: 1.3;
  }

  .controls {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
  }

  .btn, .btn-primary {
    height: 2.6rem;
    padding: 0 1.3rem;
    border-radius: 0.6rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn {
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--line);
  }
  .btn:hover { border-color: var(--ink); }
  .btn-primary {
    min-width: 9.5rem;
    background: var(--sea);
    color: #fff;
    border: 0;
  }
  .btn-primary:hover { background: var(--sea-deep); }
  .btn:active, .btn-primary:active { transform: translateY(1px); }
  .btn:focus-visible, .btn-primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .push { margin-left: auto; }

  .count {
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* Switches: level and twist */
  .pick { display: inline-flex; align-items: center; gap: 0.5rem; }
  .pick-label { color: var(--ink-soft); font-size: 0.9rem; font-weight: 600; }
  .switch {
    display: inline-flex;
    height: 2.6rem;
    border: 2px solid var(--line);
    border-radius: 0.6rem;
    overflow: hidden;
  }
  .switch button {
    padding: 0 0.95rem;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .switch button.on { background: var(--ink); color: #fff; }
  .switch button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* ---------- Starters ---------- */

  .box {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(1.4rem, 4vw, 3rem);
    border: 0;
    border-radius: 0.7rem;
    background: var(--level);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color 250ms ease;
  }
  .box:hover { filter: brightness(0.98); }
  .box:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .box .count {
    position: absolute;
    top: 1rem;
    right: 1.3rem;
    color: var(--ink);
    font-size: 0.85rem;
    opacity: 0.55;
  }
  .content { display: block; transition: opacity 300ms ease; }
  .content.fading { opacity: 0; }
  .sentence {
    display: block;
    font-size: clamp(1.8rem, min(5vw, 8vh), 4.2rem);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .conn {
    display: inline-block;
    margin-left: 0.1em;
    padding: 0 0.3em;
    border-radius: 0.35em;
    background: var(--ink);
    color: var(--mist);
  }
  .word {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
    margin-top: clamp(1rem, 3vh, 2rem);
    font-size: clamp(1.05rem, 2.2vw, 1.35rem);
  }
  .word b {
    padding: 0.2em 0.6em;
    border-radius: 0.6rem;
    background: var(--paper);
    font-size: clamp(1.4rem, min(3.4vw, 5.5vh), 2.1rem);
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  /* ---------- Because But So ---------- */

  .board {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(1rem, 3vw, 2.5rem);
    border-radius: 0.7rem;
    background: var(--board);
  }
  .stem-wrap { flex: 1; display: flex; align-items: center; min-height: 0; }
  .stem {
    margin: 0;
    font-size: clamp(1.8rem, min(5vw, 8vh), 4.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-wrap: balance;
  }
  .stem .join {
    display: inline-block;
    padding: 0 0.3em;
    border-radius: 0.35em;
    background: var(--c);
    animation: pop 0.35s ease-out;
  }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } }

  .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(0.6rem, 1.6vw, 1.1rem); }
  .link {
    padding: clamp(0.7rem, 2.5vh, 1.6rem) 0.5rem;
    border-radius: 0.7rem;
    background: var(--c);
    text-align: center;
    font-size: clamp(1.4rem, min(3.2vw, 5vh), 2.6rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    opacity: 0.3;
    transform: scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
  }
  .link.long { font-size: clamp(1rem, min(2vw, 3.4vh), 1.7rem); }
  .link.on { opacity: 1; transform: scale(1); box-shadow: inset 0 0 0 3px var(--ink); }
  .because { --c: var(--because); }
  .but { --c: var(--but); }
  .so { --c: var(--so); }

  /* ---------- Smaller screens ---------- */

  /* The tabs drop to their own row, flush with the frame's left edge. */
  @media (max-width: 820px) {
    .tabs { order: 3; flex-basis: 100%; }
    .back { margin-bottom: 0.6rem; }
    .frame { border-top-left-radius: 0; }
  }

  /* Phones: everything stacks and the page scrolls if it needs to. */
  @media (max-width: 720px) {
    html, body { height: auto; overflow: auto; }
    .page { height: auto; min-height: 100vh; min-height: 100dvh; }
    .box { min-height: 18rem; }
    .board { min-height: 22rem; }
    .push { margin-left: 0; }
    .switch button { padding: 0 0.55rem; font-size: 0.9rem; }
    .pick { max-width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .content, .box, .link { transition: none; }
    .stem .join { animation: none; }
  }
</style>
</head>
<body>
<main class="page">

  <div class="top">
    <h1>Complete the Sentence</h1>
    <div class="tabs" role="tablist" aria-label="Games" id="tabs"></div>
    <a class="back" href="./">&larr; Word Lab</a>
  </div>

  <div class="frame">

    <!-- Starters: the start of a sentence, with an optional connector and word to use. -->
    <section class="game" id="starters-game" role="tabpanel" aria-labelledby="tab-starters">
      <p class="intro">We give you the start. You finish it your way.</p>

      <button type="button" class="box" id="box" aria-label="Show another sentence">
        <span class="count" id="starter-count"></span>
        <span class="content" id="content">
          <span class="sentence" id="sentence"></span>
          <span class="word" id="word" hidden>Use the word <b id="word-text"></b></span>
        </span>
      </button>

      <div class="controls">
        <button type="button" class="btn-primary" id="starter-next">Next</button>
        <div class="pick push">
          <span class="pick-label" id="level-label">Level</span>
          <div class="switch" id="starter-level" role="group" aria-labelledby="level-label">
            <button type="button" data-v="a1">A1</button>
            <button type="button" data-v="a2" class="on">A2</button>
            <button type="button" data-v="b1">B1</button>
            <button type="button" data-v="b2">B2</button>
          </div>
        </div>
        <div class="pick">
          <span class="pick-label" id="twist-label">Twist</span>
          <div class="switch" id="starter-twist" role="group" aria-labelledby="twist-label">
            <button type="button" data-v="none" class="on">None</button>
            <button type="button" data-v="conn">Connector</button>
            <button type="button" data-v="word">Word</button>
            <button type="button" data-v="both">Both</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Because But So: one sentence, finished three ways. -->
    <section class="game" id="bbs-game" role="tabpanel" aria-labelledby="tab-bbs" hidden>
      <p class="intro">Complete the sentence. Use the word that lights up.</p>

      <div class="board">
        <div class="stem-wrap">
          <p class="stem" id="stem"></p>
        </div>
        <div class="links" aria-hidden="true">
          <div class="link because" data-j="reason"></div>
          <div class="link but" data-j="contrast"></div>
          <div class="link so" data-j="result"></div>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn" id="bbs-prev">Back</button>
        <button type="button" class="btn-primary" id="bbs-next">Show the word</button>
        <span class="count" id="bbs-count"></span>
        <div class="pick push">
          <span class="pick-label" id="bbs-level-label">Level</span>
          <div class="switch" id="bbs-level" role="group" aria-labelledby="bbs-level-label">
            <button type="button" data-v="a2" class="on">A2</button>
            <button type="button" data-v="b1">B1</button>
            <button type="button" data-v="b2">B2</button>
          </div>
        </div>
      </div>
    </section>

  </div>
</main>

<script>
/* ---------------------------------------------------------------
   Two games on one page, chosen with the tabs at the top.
   A link can open a tab directly: ?mode=starters or ?mode=bbs.
   Otherwise the page opens on the last one used.
   To rename a tab, change its label here.
---------------------------------------------------------------- */
const GAMES = [
  { id: "starters", label: "Starters" },
  { id: "bbs", label: "Because But So" }
];

const $ = (id) => document.getElementById(id);

/* A row of buttons where one is picked: level, twist. */
function wireSwitch(el, onPick) {
  el.querySelectorAll("button").forEach((b) => {
    b.setAttribute("aria-pressed", b.classList.contains("on"));
    b.addEventListener("click", () => {
      el.querySelectorAll("button").forEach((x) => {
        x.classList.toggle("on", x === b);
        x.setAttribute("aria-pressed", x === b);
      });
      onPick(b.dataset.v);
    });
  });
}

/* ===============================================================
   Starters
================================================================ */

/* ---------- Sentence starters by level ---------- */
const STARTERS = {
  a1: [
    "I like…", "I don't like…", "My favourite colour is…", "My favourite food is…",
    "My favourite animal is…", "I can…", "I can't…", "My best friend is…",
    "At the weekend, I…", "In my bag, there is…", "In the morning, I…", "After school, I…",
    "My family is…", "My bedroom is…", "I'm good at…", "My favourite day is…",
    "On my birthday, I…", "In summer, I…", "For breakfast, I eat…", "I live in…",
    "My favourite game is…", "I'm happy when…", "My house has…", "I want…",
    "My favourite toy is…"
  ],
  a2: [
    "On Mondays…", "In my free time…", "My favourite…", "Yesterday…", "I never…", "I always…",
    "One place I would love to visit is…", "My favourite meal to cook is…", "A hobby I enjoy is…",
    "My dream job is…", "The best part of my day is…", "My favourite app is…",
    "A language I would love to learn is…", "My best friend is…", "On weekends, I usually…",
    "My favourite film is…", "The last book I read was…", "My favourite season is…",
    "I'm afraid of…", "My family is…", "I feel happy when…", "My favourite sport is…",
    "My favourite animal is…", "I usually eat breakfast at…", "My favourite colour is…",
    "At school, I'm good at…", "My favourite song right now is…", "The last holiday I went on was…",
    "I would love to meet…", "My favourite time of day is…", "I relax by…", "Last year…",
    "I was born…", "I have never…",
    "I like the weather when it's…", "In my town, there is…", "My favourite website is…",
    "I use my phone to…", "This year I want to learn…", "Outside, I like to…",
    "The best present I got was…", "Something funny that happened to me was…",
    "Next year, I'm going to…"
  ],
  b1: [
    "If I could study any subject at university, it would be…",
    "If I could start a YouTube channel, it would be about…",
    "If I had more time, I would…", "If I won the lottery, I would…",
    "My perfect weekend would be…", "I get nervous when…", "I feel proud when…",
    "The best advice I've ever received is…", "In the future…",
    "My favourite social media platform is…", "The most useful technology for me is…",
    "If I could live anywhere, I would choose…", "I've been learning English for…",
    "Something I'd like to change about my town is…", "The best thing about being a teenager is…",
    "When I was younger, I used to…", "I'm really looking forward to…",
    "A person who inspires me is…", "If I were the head of my school, I would…",
    "The worst thing about social media is…", "Something I've always wanted to try is…",
    "In ten years' time, I'll probably…", "I think people should…",
    "The most difficult thing about learning English is…", "My favourite memory is…",
    "I wish I could…", "One rule I would change is…", "I've never understood why…"
  ],
  b2: [
    "Happiness is…", "Success means…", "Looking back, I should have…",
    "The older I get, the more…", "Something people often misunderstand about me is…",
    "If I had been born 100 years ago, I…", "One thing that should be taught at school is…",
    "I can't stand it when…", "By the time I'm 30, I will have…", "I'd rather… than…",
    "The biggest problem facing my generation is…", "If it weren't for…",
    "I'm still not used to…", "Social media has made people…",
    "The best decision I've ever made was…", "I've recently started…",
    "I would never… unless…", "A habit I'd like to break is…",
    "One thing I've changed my mind about is…", "The one thing I couldn't live without is…",
    "Something that annoys me more than it should is…", "If I hadn't started learning English, I…",
    "What I find most interesting about people is…", "It's not worth worrying about…",
    "The most overrated thing in the world is…"
  ]
};

/* ---------- Connectors by level ---------- */
const CONNECTORS = {
  a1: ["and", "but", "because"],
  a2: ["and", "but", "because", "so", "when"],
  b1: ["because", "but", "so", "although", "when", "if"],
  b2: ["although", "whereas", "even though", "despite", "unless", "as long as", "which means"]
};

/* ---------- Words to use, by level (concrete, teen-friendly) ---------- */
const WORDS = {
  a1: ["apple","ball","bike","bird","book","bus","cake","cat","chair","chocolate","computer","dog",
       "door","duck","egg","fish","flower","football","garden","guitar","hat","horse","ice cream",
       "kite","lemon","monkey","moon","orange","park","pencil","phone","pizza","rabbit","rain",
       "robot","sandwich","sea","shoe","snake","snow","sun","table","tree","TV","water","window","zoo"],
  a2: ["airport","backpack","beach","birthday","blanket","bridge","camera","castle","cinema","cloud",
       "competition","concert","desert","dictionary","festival","forest","fridge","gift","headphones",
       "helmet","homework","island","jacket","kitchen","ladder","laptop","library","map","market",
       "mountain","museum","passport","piano","pillow","postcard","river","skateboard","sofa",
       "stadium","suitcase","swimming pool","tent","ticket","torch","towel","umbrella","wallet","waterfall"],
  b1: ["advertisement","alarm clock","ambulance","audience","battery","cartoon","challenge","charity",
       "costume","crowd","decoration","documentary","engine","exhibition","firework","fountain","gadget",
       "headline","hero","instrument","journey","lighthouse","magazine","mirror","mystery","neighbour",
       "opportunity","painting","password","planet","podcast","recipe","rumour","scarf","secret",
       "souvenir","storm","stranger","subtitles","sunglasses","timetable","tournament","traffic",
       "trophy","volunteer","wildlife"],
  b2: ["ambition","architecture","atmosphere","awareness","campaign","celebrity","compromise",
       "curiosity","deadline","dilemma","drone","empathy","experiment","fame","gap year","generation",
       "habit","heritage","imagination","influencer","inspiration","landscape","legacy","masterpiece",
       "nostalgia","obstacle","patience","pollution","privacy","procrastination","reputation","routine",
       "satellite","sculpture","skyscraper","streaming","sustainability","talent","teamwork",
       "tradition","trend","virtual reality","wisdom"]
};

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}
/* A shuffled deck per list, so nothing repeats until everything has been shown */
const decks = {};
function draw(key, list) {
  let d = decks[key];
  if (!d || !d.cards.length) {
    const last = d ? d.last : null;
    d = decks[key] = { cards: shuffle(list.slice()), last, shown: 0 };
    if (d.cards.length > 1 && d.cards[d.cards.length - 1] === last) d.cards.unshift(d.cards.pop());
  }
  d.last = d.cards.pop();
  d.shown++;
  return d.last;
}

const box = $("box"), content = $("content");
let sLevel = "a2";
let sTwist = "none";
let current = null;     // the sentence on screen (null until the tab is first opened)

function renderStarter() {
  const useConn = sTwist === "conn" || sTwist === "both";
  const useWord = sTwist === "word" || sTwist === "both";
  const sentence = $("sentence");
  sentence.textContent = current.starter;
  if (useConn) {
    const c = document.createElement("span");
    c.className = "conn";
    c.textContent = current.conn + "…";
    sentence.append(" ", c);
  }
  $("word-text").textContent = current.word;
  $("word").hidden = !useWord;
  $("starter-count").textContent = decks["s-" + sLevel].shown + " / " + STARTERS[sLevel].length;
}

function nextStarter(fade) {
  current = {
    starter: draw("s-" + sLevel, STARTERS[sLevel]),
    conn: draw("c-" + sLevel, CONNECTORS[sLevel]),
    word: draw("w-" + sLevel, WORDS[sLevel])
  };
  if (fade === false) { renderStarter(); return; }
  content.classList.add("fading");
  setTimeout(() => { renderStarter(); content.classList.remove("fading"); }, 220);
}

box.addEventListener("click", nextStarter);
$("starter-next").addEventListener("click", nextStarter);
wireSwitch($("starter-level"), (lv) => {
  sLevel = lv;
  box.style.setProperty("--level", `var(--${lv})`);
  nextStarter();
});
/* Changing the twist keeps the same sentence and just adds or removes the extras */
wireSwitch($("starter-twist"), (tw) => { sTwist = tw; renderStarter(); });

/* ===============================================================
   Because But So
================================================================ */

const stems = {
  a2: [
    "I love the summer", "I don't like Mondays", "My brother is always tired", "I want a dog",
    "It rained all weekend", "My phone is very old", "I'm hungry", "I went to the beach yesterday",
    "My best friend is really funny", "I didn't do my homework", "I like playing video games",
    "I don't like vegetables", "The bus was late this morning", "I'm learning English",
    "My bedroom is very small", "I want to go to London", "I got up early on Saturday",
    "My teacher is very nice", "I lost my keys", "I like watching films at home",
    "It's very hot today", "I don't like shopping", "I'm going to a party tonight",
    "My dad cooks every Sunday", "I can't swim very well"
  ],
  b1: [
    "I've never been on a plane", "I'd like to live in another country", "I spend too much time on my phone",
    "Our school should start later", "I'm saving money", "I was really nervous before the exam",
    "I've been learning English for years", "My town is quite quiet", "I prefer texting to phoning",
    "I stayed at home last weekend", "I'm not very good at maths", "I'd love to be famous",
    "The summer holidays are too long", "I usually walk to school", "My friend forgot my birthday",
    "I don't really like big parties", "I want to learn to drive", "Homework is important",
    "I've started a new hobby", "Online shopping is really easy", "I often feel tired in the morning",
    "I'm going to study abroad one day", "Football is the best sport", "I tried sushi for the first time",
    "Our city needs more parks"
  ],
  b2: [
    "Social media is useful", "Everyone should learn a second language", "Video games can be good for you",
    "Tourists are changing my city", "Mobile phones should be banned in schools", "Working from home is the future",
    "Fast fashion is very popular", "Exams don't show what students really know", "AI can write essays",
    "Famous people have a lot of influence", "Public transport should be free", "Living in a big city is exciting",
    "Young people should be able to vote at 16", "School uniforms are still common",
    "Recycling isn't enough to save the planet", "Sport should be compulsory at school",
    "Streaming has changed the music industry", "Travelling is the best way to learn",
    "Many people eat too much meat", "Money can't buy happiness", "Robots will do many of our jobs",
    "Reading is less popular than it used to be", "A part-time job is a good idea for teenagers",
    "Space exploration is very expensive", "Being bilingual gives you an advantage"
  ]
};

// Linking words for each level. Each job (reason, contrast, result) can
// have more than one word; B2 mixes them. "start" words go at the front.
const W = {
  because:      { w: "because" },
  but:          { w: "but" },
  so:           { w: "so" },
  since:        { w: "since" },
  as:           { w: "as" },
  however:      { w: "However,", sentence: true },
  although:     { w: "although", comma: true },
  therefore:    { w: "Therefore,", sentence: true },
  consequently: { w: "Consequently,", sentence: true }
};
const LINKS = {
  a2: { reason: ["because"], contrast: ["but"], result: ["so"] },
  b1: { reason: ["because"], contrast: ["but"], result: ["so"] },
  b2: { reason: ["since"], contrast: ["although"], result: ["consequently"] }
};
const CLASS = { reason: "because", contrast: "but", result: "so" };

// Three cycles through the 25 sentences. In each cycle a sentence gets a
// different job, so by the end every sentence has used all three.
const FUNCS = ["reason", "contrast", "result"];
function buildSteps(list, lv) {
  const steps = [];
  for (let cycle = 0; cycle < 3; cycle++) {
    list.forEach((s, i) => {
      const f = FUNCS[(i + cycle) % 3], opts = LINKS[lv][f];
      steps.push({ s, f, key: opts[i % opts.length] });
    });
  }
  return steps;
}
const steps = { a2: buildSteps(stems.a2, "a2"), b1: buildSteps(stems.b1, "b1"), b2: buildSteps(stems.b2, "b2") };
const pos = { a2: 0, b1: 0, b2: 0 };
let bLevel = "a2";
let revealed = false;

const stemEl = $("stem");
const bbsCount = $("bbs-count");
const bbsNext = $("bbs-next");
const linkTiles = document.querySelectorAll(".link");

const plain = (k) => W[k].w.replace(/,$/, "").toLowerCase();
// lower-case the first letter, but keep things like "AI"
const lower = (t) => /^[A-Z][A-Z]/.test(t) ? t : t.charAt(0).toLowerCase() + t.slice(1);

function chip(step) {
  const j = document.createElement("span");
  j.className = "join " + CLASS[step.f];
  j.textContent = W[step.key].w;
  return j;
}

function showStem() {
  const list = steps[bLevel], step = list[pos[bLevel]], link = W[step.key];
  linkTiles.forEach((t) => {
    const lit = revealed && t.dataset.j === step.f;
    t.textContent = lit ? plain(step.key) : LINKS[bLevel][t.dataset.j].map(plain).join(" / ");
    t.classList.toggle("on", lit);
    t.classList.toggle("long", t.textContent.length > 12);
  });
  stemEl.innerHTML = "";
  if (!revealed) {
    stemEl.append(step.s + " …");
  } else if (link.start) {
    stemEl.append(chip(step), " " + lower(step.s) + ", …");
  } else {
    stemEl.append(step.s + (link.sentence ? ". " : link.comma ? ", " : " "), chip(step), " …");
  }
  bbsNext.textContent = revealed ? "Next" : "Show the word";
  bbsCount.textContent = `${pos[bLevel] + 1} / ${list.length}`;
}

function moveStem(d) {
  const n = steps[bLevel].length;
  pos[bLevel] = (pos[bLevel] + d + n) % n;
  revealed = false;
  showStem();
}

function forward() {
  if (!revealed) { revealed = true; showStem(); } else { moveStem(1); }
}

bbsNext.addEventListener("click", forward);
$("bbs-prev").addEventListener("click", () => moveStem(-1));
wireSwitch($("bbs-level"), (lv) => { bLevel = lv; revealed = false; showStem(); });

/* ===============================================================
   The tabs
================================================================ */

const tabsEl = $("tabs");
let mode = GAMES[0].id;
try {
  const saved = localStorage.getItem("complete.mode");
  if (GAMES.some((g) => g.id === saved)) mode = saved;
} catch (e) { /* ignore */ }
const asked = new URLSearchParams(location.search).get("mode");
if (GAMES.some((g) => g.id === asked)) mode = asked;

function applyMode() {
  tabsEl.querySelectorAll(".tab").forEach((tab) => {
    const on = tab.id === "tab-" + mode;
    tab.setAttribute("aria-selected", on);
    tab.tabIndex = on ? 0 : -1;
  });
  GAMES.forEach((g) => { $(g.id + "-game").hidden = g.id !== mode; });
  if (mode === "starters") { if (!current) nextStarter(false); }
  else showStem();
}

function chooseMode(id) {
  mode = id;
  try { localStorage.setItem("complete.mode", mode); } catch (e) { /* ignore */ }
  applyMode();
}

GAMES.forEach((game) => {
  const tab = document.createElement("button");
  tab.type = "button";
  tab.className = "tab";
  tab.id = "tab-" + game.id;
  tab.setAttribute("role", "tab");
  tab.setAttribute("aria-controls", game.id + "-game");
  tab.textContent = game.label;
  tab.addEventListener("click", () => chooseMode(game.id));
  tabsEl.appendChild(tab);
});

/* Left and right arrows move between the tabs when one of them has the focus. */
tabsEl.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
  const at = GAMES.findIndex((g) => g.id === mode);
  const to = GAMES[(at + (event.key === "ArrowRight" ? 1 : GAMES.length - 1)) % GAMES.length];
  chooseMode(to.id);
  $("tab-" + to.id).focus();
});

/* ---------- keyboard ----------
   Starters: Space or Enter gives a new sentence.
   Because But So: Space, Enter or the right arrow moves on; the left arrow goes back. */
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const target = event.target.closest ? event.target : document.body;
  if (target.closest(".tabs")) return;
  const press = event.code === "Space" || event.key === "Enter";
  if (press && target.closest("button, a")) return;

  if (mode === "starters") {
    if (press) { event.preventDefault(); nextStarter(); }
  } else {
    if (press || event.key === "ArrowRight") { event.preventDefault(); forward(); }
    else if (event.key === "ArrowLeft") moveStem(-1);
  }
});

applyMode();
</script>
</body>
