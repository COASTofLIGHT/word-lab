<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --sea: #17677A;
    --sea-deep: #124F5E;
    --focus: #0B62A4;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --home: #F4B5A0;       /* the team on the left, attacking right */
    --away: #A9CCEB;       /* the team on the right, attacking left */
    --grass: #C7DE9F;
    --grass-dark: #B7D18A;
    --chalk: rgba(255, 255, 255, 0.9);
  }

  *, *::before, *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 1300px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: clamp(0.85rem, 2.6vw, 2rem);
    display: flex;
    flex-direction: column;
    gap: clamp(0.55rem, 1.6vh, 0.9rem);
  }

  .top {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.25rem 1.5rem;
  }

  /* The title, with the two games beside it */
  .head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem 1.2rem;
  }

  .top h1 {
    margin: 0;
    font-size: clamp(1.4rem, 2.8vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .back {
    color: var(--ink-soft);
    font-size: 0.9rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- Scoreboard ---------- */

  .board {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: clamp(0.6rem, 1.6vw, 1.1rem);
  }

  /* A team's panel fills with its colour when it is that team's question.
     Name and direction share one line, to leave the height for the pitch. */
  .team {
    display: flex;
    align-items: center;
    gap: 0.3rem 0.9rem;
    min-width: 0;
    padding: 0.3rem clamp(0.8rem, 1.8vw, 1.3rem);
    border: 3px solid var(--tc);
    border-radius: 0.9rem;
    transition: background-color 0.2s ease;
  }
  .team.home { --tc: var(--home); }
  .team.away { --tc: var(--away); flex-direction: row-reverse; text-align: right; }
  .team.active { background: var(--tc); }

  .team input {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    padding: 0;
    border: 0;
    border-bottom: 2px dashed transparent;
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: clamp(1.15rem, 2.2vw, 1.7rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: inherit;
  }
  .team input:hover, .team input:focus { outline: none; border-bottom-color: var(--line); }

  .dir {
    flex: 0 0 auto;
    color: var(--ink-soft);
    font-size: clamp(0.8rem, 1.2vw, 0.95rem);
    font-weight: 600;
    white-space: nowrap;
  }

  .middle {
    display: grid;
    justify-items: center;
    align-content: center;
    padding: 0 clamp(0.25rem, 1.5vw, 1.25rem);
  }
  .score {
    font-size: clamp(1.9rem, 4.2vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .score .dash { margin: 0 0.15em; color: var(--ink-soft); font-weight: 600; }
  .clock {
    margin-top: 0.1rem;
    color: var(--ink-soft);
    font-size: clamp(0.9rem, 1.3vw, 1.05rem);
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .clock.late { color: #B4472B; }

  /* ---------- The three verb games: the verb to answer ---------- */

  .verbs {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr;              /* Both forms: the verb and two answers */
    gap: clamp(0.6rem, 1.6vw, 1.1rem);
  }
  .verbs.with-sentence { grid-template-columns: minmax(9rem, 0.42fr) 1fr; }   /* the verb and a sentence */

  .vcard {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    padding: 0.35rem clamp(0.8rem, 1.8vw, 1.3rem) 0.45rem;
    border: 3px solid var(--line);
    border-radius: 0.9rem;
  }
  .vcard > span {
    color: var(--ink-soft);
    font-size: clamp(0.8rem, 1.2vw, 0.95rem);
    font-weight: 600;
  }
  .vcard strong {
    font-size: clamp(1.4rem, min(3.2vw, 5.5vh), 2.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  /* An answer with two forms (learnt / learned) is smaller, so it stays on one line and the row keeps its height. */
  .vcard strong.two { font-size: clamp(1.1rem, min(2.2vw, 4vh), 1.85rem); line-height: 1.45; }
  /* The sentence stays on one line: the script makes it smaller if it is a long one. */
  .vcard strong.sentence {
    overflow: hidden;
    font-size: clamp(1.3rem, min(2.9vw, 5vh), 2.3rem);
    font-weight: 700;
    line-height: 1.25;
    white-space: nowrap;
    overflow-wrap: normal;
    text-wrap: nowrap;
  }
  .sentence .gap {            /* where the verb goes */
    display: inline-block;
    width: 3.4em;
    margin: 0 0.12em;
    border-bottom: 0.1em dashed var(--ink);
  }
  .sentence .fill {           /* the answer, once it is shown */
    padding: 0 0.3em;
    border-radius: 0.3em;
    background: var(--ink);
    color: #fff;
  }
  /* The verb wears the colour of the team that has to answer. */
  .vcard.base { border-color: var(--tc, var(--home)); background: var(--tc, var(--home)); transition: background-color 0.2s ease, border-color 0.2s ease; }
  .vcard.base > span { color: var(--ink); }
  /* The answers stay hidden until "Show answer". */
  .vcard.ans { border-style: dashed; }
  .vcard.ans strong { color: var(--ink-soft); }
  .vcard.ans.shown { border-style: solid; border-color: var(--ink); background: #fff; }
  .vcard.ans.shown strong { color: var(--ink); }

  /* Takes whatever room is left on the row, and is cut short before it pushes a button on to a new line */
  .last {
    flex: 1 1 0;
    min-width: 0;
    margin-left: 0.4rem;
    overflow: hidden;
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-weight: 600;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }

  /* ---------- Pitch ---------- */

  .ground {
    position: relative;
    flex: 1 1 auto;
    min-height: 10rem;
    display: flex;
    align-items: stretch;
  }

  .goal {
    flex: 0 0 clamp(1.8rem, 4.5%, 3.6rem);
    align-self: center;
    height: 44%;
    border: 4px solid var(--ink);
    background-color: var(--gc);
    background-image:
      linear-gradient(rgba(16, 48, 58, 0.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(16, 48, 58, 0.2) 1px, transparent 1px);
    background-size: 9px 9px;
  }
  /* Each goal wears the colour of the team defending it. */
  .goal.left { --gc: var(--home); border-right: 0; border-radius: 0.5rem 0 0 0.5rem; }
  .goal.right { --gc: var(--away); border-left: 0; border-radius: 0 0.5rem 0.5rem 0; }

  .pitch {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    border-radius: 0.9rem;
    overflow: hidden;
    background: var(--grass);
  }
  /* The mown strips are the steps the ball takes. */
  .strip { flex: 1 1 0; }
  .strip:nth-child(even) { background: var(--grass-dark); }

  /* Chalk lines, drawn over the strips */
  .lines {
    position: absolute;
    inset: clamp(0.5rem, 1.2vw, 0.9rem);
    border: 3px solid var(--chalk);
    pointer-events: none;
  }
  .lines::before {            /* halfway line */
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 3px;
    margin-left: -1.5px;
    background: var(--chalk);
  }
  .lines::after {             /* centre circle */
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    height: 42%;
    aspect-ratio: 1;
    border: 3px solid var(--chalk);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .area {                     /* penalty areas */
    position: absolute;
    top: 21%; bottom: 21%;
    width: 8%;
    border: 3px solid var(--chalk);
  }
  .area.left { left: -3px; }
  .area.right { right: -3px; }

  .ball {
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(2.6rem, 10vh, 4.6rem);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    transition: left 0.55s cubic-bezier(0.3, 0.7, 0.3, 1);
    filter: drop-shadow(0 4px 0 rgba(16, 48, 58, 0.18));
    pointer-events: none;
  }
  .ball svg {
    display: block;
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(0.3, 0.7, 0.3, 1);
  }

  /* "Goal!" and "Full time" */
  .shout {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .shout div {
    padding: 0.2em 0.7em 0.25em;
    border-radius: 0.9rem;
    background: var(--ink);
    color: #fff;
    text-align: center;
    animation: pop 0.3s ease-out both;
  }
  .shout strong {
    display: block;
    font-size: clamp(2.4rem, 9vw, 6.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .shout span {
    display: block;
    margin-bottom: 0.4em;
    font-size: clamp(1.1rem, 2.6vw, 2rem);
    font-weight: 700;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.85); } }

  /* ---------- Buttons ---------- */

  .row {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
  }

  .turn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-right: 0.4rem;
    font-size: clamp(1.1rem, 2vw, 1.5rem);
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .turn .dot {
    width: 0.9em;
    height: 0.9em;
    border-radius: 50%;
    background: var(--tc, var(--home));
    border: 2px solid var(--ink);
  }

  .btn, .btn-primary {
    height: 2.6rem;
    padding: 0 1.3rem;
    border-radius: 0.6rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn {
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--line);
  }
  .btn:hover { border-color: var(--ink); }
  .btn-primary {
    background: var(--sea);
    color: #fff;
    border: 0;
  }
  .btn-primary:hover { background: var(--sea-deep); }
  .btn:active, .btn-primary:active { transform: translateY(1px); }
  .btn:focus-visible, .btn-primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn:disabled, .btn-primary:disabled { opacity: 0.4; cursor: default; transform: none; }

  .push { margin-left: auto; }

  .label { color: var(--ink-soft); font-size: 0.9rem; font-weight: 600; }
  .label.gap { margin-left: 0.7rem; }

  .switch {
    display: inline-flex;
    height: 2.6rem;
    border: 2px solid var(--line);
    border-radius: 0.6rem;
    overflow: hidden;
  }
  .switch button {
    padding: 0 0.95rem;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .switch button.on { background: var(--ink); color: #fff; }
  .switch button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* Phones: the page scrolls if it needs to. */
  @media (max-width: 720px) {
    html, body { height: auto; overflow: auto; }
    .page { height: auto; min-height: 100vh; min-height: 100dvh; }
    .ground { flex: 0 0 auto; height: 14rem; }
    .dir { display: none; }
    .push { margin-left: 0; }
    .label.gap { margin-left: 0; }
    .verbs, .verbs.with-sentence { grid-template-columns: 1fr 1fr; }
    .vcard.base, .vcard.wide { grid-column: 1 / -1; }
    .vcard strong.sentence { white-space: normal; text-wrap: balance; }
    .last { flex: 0 0 100%; margin-left: 0; white-space: normal; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ball, .ball svg, .team, .vcard.base { transition: none; }
    .shout div { animation: none; }
  }
</style>
</head>
<body>
<main class="page">

  <div class="top">
    <div class="head">
      <h1>Football</h1>
      <!-- Football: bring your own questions. The other three give an irregular verb each turn. -->
      <div class="switch" role="tablist" aria-label="Games" id="tabs">
        <button type="button" role="tab" id="tab-football" data-mode="football" class="on" aria-selected="true">Football</button>
        <button type="button" role="tab" id="tab-past" data-mode="past" aria-selected="false" tabindex="-1">Past simple</button>
        <button type="button" role="tab" id="tab-participle" data-mode="participle" aria-selected="false" tabindex="-1">Past participle</button>
        <button type="button" role="tab" id="tab-both" data-mode="both" aria-selected="false" tabindex="-1">Both forms</button>
      </div>
    </div>
    <a class="back" href="./">&larr; Word Lab</a>
  </div>

  <div class="board">
    <div class="team home active" id="home-panel">
      <input id="home-name" type="text" value="Home" maxlength="14" aria-label="Name of the team on the left"
             autocomplete="off" spellcheck="false">
      <span class="dir">attacking this way &rarr;</span>
    </div>
    <div class="middle">
      <div class="score" aria-live="polite"><span id="home-score">0</span><span class="dash">&ndash;</span><span id="away-score">0</span></div>
      <div class="clock" id="clock" role="timer">5:00</div>
    </div>
    <div class="team away" id="away-panel">
      <input id="away-name" type="text" value="Away" maxlength="14" aria-label="Name of the team on the right"
             autocomplete="off" spellcheck="false">
      <span class="dir">&larr; attacking this way</span>
    </div>
  </div>

  <!-- The verb games only: the verb for this turn, then either a sentence with a gap or the two forms to say -->
  <div class="verbs" id="verbs" hidden>
    <div class="vcard base"><span>Infinitive</span><strong id="v-base"></strong></div>
    <div class="vcard ans wide" id="v-sentence-card"><span id="v-sentence-label"></span><strong class="sentence" id="v-sentence"></strong></div>
    <div class="vcard ans" id="v-past-card"><span>Past simple</span><strong id="v-past">?</strong></div>
    <div class="vcard ans" id="v-part-card"><span>Past participle</span><strong id="v-part">?</strong></div>
  </div>

  <div class="ground" id="ground">
    <div class="goal left" id="goal-left"></div>
    <div class="pitch" id="pitch"></div>
    <div class="goal right" id="goal-right"></div>
    <div class="ball" id="ball"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="round"><circle cx="50" cy="50" r="45"/></clipPath></defs><circle cx="50" cy="50" r="45" fill="#fff"/><g clip-path="url(#round)" stroke="#10303A" stroke-width="3" stroke-linecap="round"><polygon points="50.0,35.0 64.3,45.4 58.8,62.1 41.2,62.1 35.7,45.4" fill="#10303A"/><line x1="50.0" y1="35.0" x2="50.0" y2="19.0"/><polygon points="50.0,19.0 38.3,11.7 38.3,-0.7 61.7,-0.7 61.7,11.7" fill="#10303A"/><line x1="64.3" y1="45.4" x2="79.5" y2="40.4"/><polygon points="79.5,40.4 82.8,27.1 94.6,23.2 101.8,45.5 90.0,49.3" fill="#10303A"/><line x1="58.8" y1="62.1" x2="68.2" y2="75.1"/><polygon points="68.2,75.1 81.9,74.1 89.2,84.1 70.3,97.9 63.0,87.8" fill="#10303A"/><line x1="41.2" y1="62.1" x2="31.8" y2="75.1"/><polygon points="31.8,75.1 37.0,87.8 29.7,97.9 10.8,84.1 18.1,74.1" fill="#10303A"/><line x1="35.7" y1="45.4" x2="20.5" y2="40.4"/><polygon points="20.5,40.4 10.0,49.3 -1.8,45.5 5.4,23.2 17.2,27.1" fill="#10303A"/></g><circle cx="50" cy="50" r="45" fill="none" stroke="#10303A" stroke-width="5"/></svg></div>
    <div class="shout" id="shout" aria-live="assertive" hidden></div>
  </div>

  <div class="row">
    <span class="turn" id="turn"><span class="dot"></span><span id="turn-text"></span></span>
    <button type="button" class="btn-primary" id="correct">Correct</button>
    <button type="button" class="btn" id="wrong">Wrong</button>
    <button type="button" class="btn" id="show-answer" hidden>Show answer</button>
    <span class="last" id="v-last" hidden></span>
    <button type="button" class="btn push" id="swap">Swap turn</button>
    <button type="button" class="btn" id="undo">Undo</button>
  </div>

  <div class="row">
    <span class="label">Pitch</span>
    <div class="switch" role="group" aria-label="Pitch length">
      <button type="button" data-steps="3" class="on" aria-pressed="true">Short</button>
      <button type="button" data-steps="5" aria-pressed="false">Long</button>
    </div>
    <span class="label gap">Clock</span>
    <div class="switch" role="group" aria-label="Minutes on the clock">
      <button type="button" data-min="5" class="on" aria-label="5 minutes">5</button>
      <button type="button" data-min="10" aria-label="10 minutes">10</button>
    </div>
    <button type="button" class="btn" id="clock-btn">Start clock</button>
    <button type="button" class="btn" id="sound" aria-pressed="true">Sound on</button>
    <!-- The verb games only: which verbs -->
    <span class="group" id="verb-settings" hidden>
      <span class="label gap">Verbs</span>
      <div class="switch" role="group" aria-label="Verb level">
        <button type="button" data-vlevel="a2" aria-pressed="false">A2</button>
        <button type="button" data-vlevel="b1" class="on" aria-pressed="true">B1</button>
      </div>
    </span>
    <button type="button" class="btn push" id="new-match">New match</button>
  </div>

</main>

<script>
/* ---------------------------------------------------------------
   A board for the classroom football game, with four tabs.
     Football:        bring your own questions.
     Past simple:     an irregular verb and a sentence with a gap.
                      The team says the past simple that fills it.
     Past participle: the same, with a gap for the past participle.
     Both forms:      just the verb. The team says the past simple
                      and the past participle.
   It is one match on one pitch: the tab only decides what is shown
   above it. A link can open a tab directly: ?mode=football,
   ?mode=past, ?mode=participle or ?mode=both. Otherwise the page
   opens on the last one used.

   The team whose turn it is answers a question:
     Correct: the ball moves one strip towards the other team's goal.
     Wrong:   the ball moves one strip back towards their own goal.
   When the ball reaches a goal, that's a goal, and it goes back to
   the centre. Turns alternate.

   Short pitch: three steps from the centre to the goal.
   Long pitch:  five steps.
---------------------------------------------------------------- */

const $ = (id) => document.getElementById(id);
const groundEl = $("ground"), pitchEl = $("pitch"), ballEl = $("ball"), ballArt = ballEl.querySelector("svg");
const shoutEl = $("shout"), clockEl = $("clock");
const homeName = $("home-name"), awayName = $("away-name");
const correctBtn = $("correct"), wrongBtn = $("wrong"), swapBtn = $("swap"), undoBtn = $("undo");
const clockBtn = $("clock-btn"), soundBtn = $("sound");

let steps = 3;                         // steps from the centre to a goal
let pos = 0;                           // where the ball is: 0 is the centre, +steps is the right-hand goal
let turn = "home";                     // home attacks to the right, away to the left
let score = { home: 0, away: 0 };
let busy = false;                      // a goal is being celebrated
let fullTime = false;
let history = [];                      // for Undo
let spin = 0;

/* ---------- The verb games: the verbs ----------
   One verb on each line, with | between the parts:
     infinitive | past simple | past participle | a past simple sentence | a past participle sentence
   ___ is the gap in a sentence. A slash means either answer is right.
   B1 uses the A2 verbs too. To add a verb, add a line. */
const VERBS = {
  a2: `be | was/were | been | It ___ very cold yesterday. | I have never ___ to London. | was
become | became | become | She ___ a doctor in 2020. | He has ___ very tall.
begin | began | begun | The film ___ at eight o'clock. | The lesson has already ___.
break | broke | broken | I ___ my arm last summer. | Someone has ___ the window.
bring | brought | brought | She ___ a cake to the party. | Have you ___ your homework?
build | built | built | They ___ this school in 1990. | The bridge was ___ last year.
buy | bought | bought | I ___ a new phone last week. | We have ___ a new car.
catch | caught | caught | He ___ the ball with one hand. | The police have ___ the thief.
choose | chose | chosen | She ___ the red dress. | Have you ___ a film yet?
come | came | come | My cousins ___ to my house on Sunday. | Spring has ___ at last.

Object.keys(VERBS).forEach((lv) => {
  VERBS[lv] = VERBS[lv].split("\n").map((line) => {
    const [base, past, part, pastSentence, partSentence, pastAnswer] = line.split("|").map((x) => x.trim());
    const both = (form) => form.replace("/", " / ");
    // pastAnswer is only needed for "be", where the sentence takes "was" and not "were".
    return { base, past: both(past), part: both(part), pastSentence, partSentence, pastAnswer };
  });
});
VERBS.b1 = VERBS.a2.concat(VERBS.b1);

const MODES = ["football", "past", "participle", "both"];
let mode = "football";
let verbLevel = "b1";
let verbPile = [];                     // shuffled verbs still to come
let verb = null;                       // the verb on screen
let answerShown = false;
let lastVerb = null;                   // the verb just answered, shown small so the class can check it

function nextVerb() {
  if (!verbPile.length) {
    verbPile = VERBS[verbLevel].slice();
    for (let i = verbPile.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [verbPile[i], verbPile[j]] = [verbPile[j], verbPile[i]];
    }
    if (verbPile.length > 1 && verbPile[verbPile.length - 1] === verb) verbPile.unshift(verbPile.pop());
  }
  verb = verbPile.pop();
  answerShown = false;
}

/* The forms the game on screen asks for: used for the "Last verb" note. */
function formsOf(v) {
  if (mode === "past") return [v.base, v.past];
  if (mode === "participle") return [v.base, v.part];
  return [v.base, v.past, v.part];
}

function paintVerb() {
  const on = mode !== "football";
  $("verbs").hidden = !on;
  $("show-answer").hidden = !on;
  $("v-last").hidden = !on;
  $("verb-settings").hidden = !on;
  if (!on) return;
  if (!verb) nextVerb();
  const withSentence = mode === "past" || mode === "participle";
  $("verbs").style.setProperty("--tc", "var(--" + turn + ")");
  $("verbs").classList.toggle("with-sentence", withSentence);
  $("v-base").textContent = verb.base;
  $("v-sentence-card").hidden = !withSentence;
  $("v-past-card").hidden = withSentence;
  $("v-part-card").hidden = withSentence;

  if (withSentence) {
    // A sentence with a gap. "Show answer" puts the right form in the gap.
    const text = mode === "past" ? verb.pastSentence : verb.partSentence;
    const answer = mode === "past" ? (verb.pastAnswer || verb.past) : verb.part;
    const [before, after] = text.split("___");
    const gap = document.createElement("span");
    gap.className = answerShown ? "fill" : "gap";
    gap.textContent = answerShown ? answer : "";
    $("v-sentence-label").textContent = mode === "past" ? "Past simple" : "Past participle";
    $("v-sentence").replaceChildren(before, gap, after);
    $("v-sentence-card").classList.toggle("shown", answerShown);
    fitSentence();
  } else {
    $("v-past").textContent = answerShown ? verb.past : "?";
    $("v-part").textContent = answerShown ? verb.part : "?";
    $("v-past").classList.toggle("two", answerShown && verb.past.includes("/"));
    $("v-part").classList.toggle("two", answerShown && verb.part.includes("/"));
    $("v-past-card").classList.toggle("shown", answerShown);
    $("v-part-card").classList.toggle("shown", answerShown);
  }
  $("show-answer").textContent = answerShown ? "Hide answer" : "Show answer";
  $("v-last").textContent = lastVerb ? "Last verb: " + formsOf(lastVerb).join(", ") : "";
}

/* A long sentence is made a little smaller until it fits on one line. On a phone it wraps. */
function fitSentence() {
  const el = $("v-sentence");
  el.style.fontSize = "";
  if ($("verbs").hidden || $("v-sentence-card").hidden || window.matchMedia("(max-width: 720px)").matches) return;
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (size > 15 && el.scrollWidth > el.clientWidth + 1) {
    size *= 0.95;
    el.style.fontSize = size + "px";
  }
}

const other = (team) => (team === "home" ? "away" : "home");
const nameOf = (team) => (team === "home" ? homeName : awayName).value.trim() || (team === "home" ? "Home" : "Away");

/* ---------- pitch ---------- */

function buildPitch() {
  pitchEl.innerHTML = "";
  for (let i = 0; i < steps * 2 - 1; i++) {
    const strip = document.createElement("div");
    strip.className = "strip";
    pitchEl.appendChild(strip);
  }
  pitchEl.insertAdjacentHTML("beforeend", '<div class="lines"><div class="area left"></div><div class="area right"></div></div>');
}

function placeBall() {
  let target;
  if (pos >= steps) target = $("goal-right");
  else if (pos <= -steps) target = $("goal-left");
  else target = pitchEl.children[pos + steps - 1];
  const ground = groundEl.getBoundingClientRect(), box = target.getBoundingClientRect();
  ballEl.style.left = box.left - ground.left + box.width / 2 + "px";
  ballArt.style.transform = "rotate(" + spin + "deg)";
}

/* ---------- sound ---------- */

let sound = true, audio = null;

function wakeAudio() {
  // Browsers only allow sound after a click, so the sound is set up on the first button press.
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) { audio = null; }
}

function notes(list) {
  if (!sound || !audio) return;
  list.forEach((freq, i) => {
    const osc = audio.createOscillator(), gain = audio.createGain();
    const t = audio.currentTime + i * 0.16;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    osc.connect(gain).connect(audio.destination);
    osc.start(t); osc.stop(t + 0.65);
  });
}

/* ---------- drawing the state ---------- */

function shout(big, small) {
  shoutEl.innerHTML = "<div><strong></strong><span></span></div>";
  shoutEl.querySelector("strong").textContent = big;
  const line = shoutEl.querySelector("span");
  line.textContent = small || "";
  line.hidden = !small;
  shoutEl.hidden = false;
}

function render() {
  $("home-score").textContent = score.home;
  $("away-score").textContent = score.away;
  $("home-panel").classList.toggle("active", turn === "home" && !fullTime);
  $("away-panel").classList.toggle("active", turn === "away" && !fullTime);
  $("turn").style.setProperty("--tc", "var(--" + turn + ")");
  $("turn-text").textContent = fullTime ? "Full time" : nameOf(turn) + " to answer";
  correctBtn.disabled = wrongBtn.disabled = swapBtn.disabled = busy || fullTime;
  undoBtn.disabled = busy || fullTime || !history.length;
  paintVerb();
  placeBall();
}

/* ---------- playing ---------- */

function remember() {
  history.push({ pos, turn, home: score.home, away: score.away, verb, answerShown, lastVerb });
  if (history.length > 200) history.shift();
}

function answer(correct) {
  if (busy || fullTime) return;
  wakeAudio();
  remember();
  const forward = turn === "home" ? 1 : -1;
  const move = correct ? forward : -forward;
  pos += move;
  spin += move * 220;
  const answered = turn;
  turn = other(turn);
  // The verb games: the other team gets a new verb, and the old one stays in view as "Last verb".
  if (mode !== "football") { lastVerb = verb; nextVerb(); }

  if (Math.abs(pos) < steps) { render(); return; }

  // The ball is in a goal. Home scores in the right-hand goal, away in the left.
  const scorer = pos > 0 ? "home" : "away";
  busy = true;
  render();
  setTimeout(() => {
    score[scorer]++;
    $("home-score").textContent = score.home;
    $("away-score").textContent = score.away;
    if (scorer === answered) shout("Goal!", nameOf(scorer));
    else shout("Own goal!", "A goal for " + nameOf(scorer));
    notes([523, 659, 784, 1047]);
    setTimeout(() => {
      busy = false;
      if (!fullTime) shoutEl.hidden = true;
      pos = 0;
      render();
    }, 1800);
  }, 600);
}

function undo() {
  if (busy || fullTime || !history.length) return;
  const last = history.pop();
  pos = last.pos; turn = last.turn; score.home = last.home; score.away = last.away;
  if (mode !== "football" && last.verb) {
    if (verb && verb !== last.verb) verbPile.push(verb);   // the verb that was waiting goes back on the pile
    verb = last.verb; answerShown = last.answerShown; lastVerb = last.lastVerb;
  }
  render();
}

correctBtn.addEventListener("click", () => answer(true));
wrongBtn.addEventListener("click", () => answer(false));
undoBtn.addEventListener("click", undo);
swapBtn.addEventListener("click", () => { if (busy || fullTime) return; remember(); turn = other(turn); render(); });
homeName.addEventListener("input", render);
awayName.addEventListener("input", render);

/* ---------- The verb games: buttons and settings ---------- */

function showAnswer() {
  if (mode === "football" || !verb) return;
  answerShown = !answerShown;
  paintVerb();
}
$("show-answer").addEventListener("click", showAnswer);

function pickOne(buttons, chosen) {
  buttons.forEach((x) => {
    x.classList.toggle("on", x === chosen);
    x.setAttribute("aria-pressed", x === chosen);
  });
}
// Changing the verbs gives a new verb straight away; the score and the ball stay.
document.querySelectorAll("[data-vlevel]").forEach((b) => b.addEventListener("click", () => {
  if (verbLevel === b.dataset.vlevel) return;
  verbLevel = b.dataset.vlevel;
  pickOne(document.querySelectorAll("[data-vlevel]"), b);
  verbPile = [];
  nextVerb();
  paintVerb();
}));

/* ---------- the four tabs ---------- */

const tabButtons = [...document.querySelectorAll("#tabs [role=tab]")];

function chooseMode(next, remember) {
  mode = next;
  tabButtons.forEach((t) => {
    const on = t.dataset.mode === mode;
    t.classList.toggle("on", on);
    t.setAttribute("aria-selected", on);
    t.tabIndex = on ? 0 : -1;
  });
  if (remember) { try { localStorage.setItem("football.mode", mode); } catch (e) { /* ignore */ } }
  render();
}
tabButtons.forEach((t, i) => {
  t.addEventListener("click", () => chooseMode(t.dataset.mode, true));
  t.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
    const to = tabButtons[(i + (event.key === "ArrowRight" ? 1 : tabButtons.length - 1)) % tabButtons.length];
    chooseMode(to.dataset.mode, true);
    to.focus();
  });
});

/* ---------- pitch length ---------- */

document.querySelectorAll("[data-steps]").forEach((b) => b.addEventListener("click", () => {
  if (busy) return;
  steps = Number(b.dataset.steps);
  document.querySelectorAll("[data-steps]").forEach((x) => {
    x.classList.toggle("on", x === b);
    x.setAttribute("aria-pressed", x === b);
  });
  // The ball goes back to the centre; the score stays.
  pos = 0;
  history = [];
  buildPitch();
  render();
}));

/* ---------- match clock (optional: the game works without it) ---------- */

let length = 300, left = 300, endAt = 0, ticking = null;

function paintClock() {
  const s = Math.ceil(left);
  clockEl.textContent = fullTime ? "Full time" : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  clockEl.classList.toggle("late", !fullTime && ticking !== null && left <= 30);
  clockBtn.textContent = ticking ? "Pause clock" : left < length && !fullTime ? "Carry on" : "Start clock";
  clockBtn.disabled = fullTime;
}

function stopClock() { clearInterval(ticking); ticking = null; }

function tick() {
  left = Math.max(0, (endAt - Date.now()) / 1000);
  if (left <= 0) {
    stopClock();
    fullTime = true;
    shout("Full time", nameOf("home") + " " + score.home + " \u2013 " + score.away + " " + nameOf("away"));
    notes([784, 784, 1047]);
    render();
  }
  paintClock();
}

clockBtn.addEventListener("click", () => {
  if (fullTime) return;
  wakeAudio();
  if (ticking) { stopClock(); paintClock(); return; }
  endAt = Date.now() + left * 1000;
  ticking = setInterval(tick, 250);
  paintClock();
});

document.querySelectorAll("[data-min]").forEach((b) => b.addEventListener("click", () => {
  if (fullTime) return;
  length = left = Number(b.dataset.min) * 60;
  document.querySelectorAll("[data-min]").forEach((x) => x.classList.toggle("on", x === b));
  stopClock();
  paintClock();
}));

soundBtn.addEventListener("click", () => {
  sound = !sound;
  soundBtn.textContent = sound ? "Sound on" : "Sound off";
  soundBtn.setAttribute("aria-pressed", sound);
});

/* ---------- new match ---------- */

$("new-match").addEventListener("click", () => {
  if (busy) return;
  score = { home: 0, away: 0 };
  pos = 0; turn = "home"; fullTime = false; history = [];
  shoutEl.hidden = true;
  stopClock(); left = length;
  paintClock();
  render();
});

/* ---------- keyboard: C correct, X wrong, U undo, and A to show the answer in the verb games
   (not while typing a team name) ---------- */

document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.target.closest && event.target.closest("input")) {
    if (event.key === "Enter") event.target.blur();
    return;
  }
  const key = event.key.toLowerCase();
  if (key === "c") answer(true);
  else if (key === "x") answer(false);
  else if (key === "u") undo();
  else if (key === "a") showAnswer();
});

/* Keep the ball on its strip, and the sentence on one line, when the window changes size. */
window.addEventListener("resize", () => { placeBall(); fitSentence(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSentence);
if (window.ResizeObserver) new ResizeObserver(placeBall).observe(groundEl);

buildPitch();
paintClock();

/* Open on the tab in the link, or the last one used. */
let startMode = "football";
try {
  const saved = localStorage.getItem("football.mode");
  if (MODES.includes(saved)) startMode = saved;
} catch (e) { /* ignore */ }
const asked = new URLSearchParams(location.search).get("mode");
if (MODES.includes(asked)) startMode = asked;
chooseMode(startMode, false);
</script>
