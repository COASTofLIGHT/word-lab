<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --focus: #0B62A4;
    --panel: #F9FBFB;
    --line: rgba(16, 48, 58, 0.14);
    --dash: rgba(16, 48, 58, 0.32);
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --big: "Atkinson Hyperlegible", var(--font);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--mist); color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 1040px; margin: 0 auto;
    padding: clamp(0.6rem, 2vh, 1.5rem) clamp(1rem, 3vw, 2rem);
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  button { font-family: var(--font); color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  button:disabled { opacity: 0.4; cursor: default; }

  .back { align-self: flex-start; color: var(--ink-soft); font-size: 0.9rem; line-height: 1.2; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Title and rules share one row so the whole game fits on screen without scrolling */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 1.6rem; }
  h1 { margin: 0; flex: 0 0 auto; font-size: clamp(1.7rem, 3vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .hint { margin: 0; flex: 1 1 24rem; color: var(--ink-soft); font-size: 0.98rem; line-height: 1.3; }

  .play {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(1rem, 3.5vw, 2.6rem); align-items: start;
  }
  .side { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }

  /* The wheel */
  /* The wheel shrinks on short screens: 270px is the room everything else in its column needs */
  .wheel { display: block; width: clamp(220px, calc(100dvh - 270px), 440px); max-width: 100%; height: auto; margin: 0 auto; }
  .cell { cursor: pointer; }
  .cell:focus { outline: none; }
  .cell .shape { stroke: var(--mist); stroke-width: 5; transition: opacity 120ms; }
  .cell text {
    font-family: var(--big); font-weight: 700; font-size: 46px; fill: var(--ink);
    text-anchor: middle; pointer-events: none; user-select: none; transition: opacity 120ms;
  }
  .cell.middle .shape { fill: var(--ink); }
  .cell.middle text { fill: var(--mist); font-size: 60px; }
  .cell:hover:not(.used) .shape { filter: brightness(0.96); }
  .cell:focus-visible .shape { stroke: var(--focus); stroke-width: 6; }
  .cell.used { cursor: default; }
  .cell.used .shape { opacity: 0.3; }
  .cell.used text { opacity: 0.35; }
  .cell.middle.used .shape { opacity: 0.45; }
  .cell.middle.used text { opacity: 1; }

  /* Typing a word */
  .entry { display: flex; gap: 0.6rem; align-items: stretch; }
  .entry input {
    flex: 1 1 auto; min-width: 0; width: 100%;
    font-family: var(--big); font-weight: 700; color: var(--ink);
    font-size: clamp(1.5rem, 3.2vw, 2.1rem); letter-spacing: 0.08em; text-transform: uppercase;
    background: #fff; border: 2px solid var(--ink); border-radius: 0.9rem;
    padding: 0.25em 0.6em; min-height: 50px;
  }
  .entry input::placeholder { color: var(--ink-soft); opacity: 0.7; font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 0.7em; }
  .entry input:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
  .entry.bad input { animation: shake 0.25s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .next {
    border: 0; cursor: pointer; border-radius: 0.9rem; background: var(--ink); color: var(--mist);
    font-size: 1.1rem; font-weight: 800; padding: 8px 20px; min-height: 46px; white-space: nowrap;
  }
  .next:hover:not(:disabled) { background: #1B4652; }
  .show {
    border: 2px solid var(--ink); cursor: pointer; border-radius: 0.9rem; background: var(--panel);
    font-size: 1rem; font-weight: 700; padding: 6px 16px; min-height: 42px;
  }
  .show:hover:not(:disabled) { background: #fff; }
  .buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .buttons .end { margin-left: auto; }

  .result { margin: 0; min-height: 1.3em; font-size: 1.1rem; font-weight: 700; line-height: 1.3; }
  .result .gaps { font-family: var(--big); letter-spacing: 0.2em; white-space: nowrap; }

  /* Words found: ten empty slots that fill up */
  .count { margin: 0; color: var(--ink-soft); font-size: 1.05rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .count b { color: var(--ink); }
  .slots {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 0.4rem;
  }
  .slots li {
    min-height: 2.5rem; display: flex; align-items: center; justify-content: center;
    border-radius: 0.6rem; padding: 0.1rem 0.3rem; white-space: nowrap;
    font-family: var(--big); font-weight: 700; font-size: clamp(1.1rem, 1.9vw, 1.35rem);
    background: var(--panel); border: 2px dashed var(--dash);
  }
  /* After ten words the list adds columns instead of rows, so the page does not grow */
  .slots[data-cols="3"] li { font-size: 1.1rem; }
  .slots[data-cols="4"] li { font-size: 0.95rem; }
  .slots li.got { background: var(--c); border: 0; }
  .slots li.fresh { animation: pop 0.18s ease-out; }
  .slots li.nine { box-shadow: inset 0 0 0 4px var(--ink); }
  .slots li:nth-child(7n+1) { --c: #A8D5CB; }
  .slots li:nth-child(7n+2) { --c: #F2D9A6; }
  .slots li:nth-child(7n+3) { --c: #F4B5A0; }
  .slots li:nth-child(7n+4) { --c: #C9C3EA; }
  .slots li:nth-child(7n+5) { --c: #A9CCEB; }
  .slots li:nth-child(7n+6) { --c: #F0C2D3; }
  .slots li:nth-child(7n+7) { --c: #C7DE9F; }
  @keyframes pop { from { transform: scale(0.88); } to { transform: none; } }

  /* The 9-letter word */
  .nine-label { margin: 0.15rem 0 0; color: var(--ink-soft); font-size: 1.05rem; line-height: 1.2; }
  .nine { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(9, 1fr); gap: 0.3rem; max-width: 23rem; }
  .nine li {
    aspect-ratio: 1; display: grid; place-items: center; border-radius: 0.45rem;
    font-family: var(--big); font-weight: 700; font-size: clamp(1rem, 2.2vw, 1.35rem); line-height: 1;
    background: var(--panel); border: 2px dashed var(--dash);
  }
  .nine.found li { background: var(--ink); color: var(--mist); border: 0; }
  .nine.shown li { background: #fff; border: 2px solid var(--ink); }

  .answers { margin: 0; font-size: 1rem; line-height: 1.35; }
  .answers[hidden] { display: none; }
  .answers b { display: block; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* The Well done! sign, shown when the tenth word goes in */
  .done {
    width: min(92vw, 34rem); padding: 0; border: 4px solid var(--ink); border-radius: 1.4rem;
    background: var(--panel); color: var(--ink); text-align: center; overflow: hidden;
    box-shadow: 0 18px 50px rgba(16, 48, 58, 0.35);
  }
  .done::backdrop { background: rgba(16, 48, 58, 0.5); }
  .done[open] { animation: sign 0.22s ease-out; }
  .done .stripe {
    height: 1.1rem;
    background: linear-gradient(90deg,
      #A8D5CB 0 14.3%, #F2D9A6 0 28.6%, #F4B5A0 0 42.9%, #C9C3EA 0 57.1%,
      #A9CCEB 0 71.4%, #F0C2D3 0 85.7%, #C7DE9F 0);
  }
  .done form { padding: clamp(1.2rem, 4vw, 2rem) clamp(1rem, 4vw, 2.2rem) clamp(1.3rem, 4vw, 2.2rem); }
  .done h2 { margin: 0; font-size: clamp(2.6rem, 8vw, 4.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .done p { text-wrap: balance; margin: 0.6rem 0 1.4rem; font-size: clamp(1.1rem, 2.6vw, 1.35rem); line-height: 1.35; }
  .done .buttons { justify-content: center; gap: 0.8rem; }
  .done .buttons button { min-height: 54px; padding: 8px 24px; font-size: 1.2rem; font-weight: 800; }
  @keyframes sign { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (max-width: 760px) {
    .play { grid-template-columns: 1fr; }
    .wheel { width: min(100%, 320px); }
    .slots { grid-template-columns: 1fr 1fr; }
    .slots[data-cols] li { font-size: 1.1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .slots li.fresh, .entry.bad input, .done[open] { animation: none; }
    .cell .shape, .cell text { transition: none; }
  }
</style>
</head>
<body>
<main>
  <!-- Change this link and label to match the section the page lives in. -->
  <a class="back" href="./">&larr; Back</a>

  <header>
    <h1>Word Wheel</h1>
    <p class="hint">Make words with 3 letters or more. Every word must use the middle letter. One word uses all 9 letters. Use each letter only as many times as you can see it. Names do not count.</p>
  </header>

  <div class="play">
    <div class="side">
      <svg class="wheel" id="wheel" viewBox="0 0 300 300" role="group" aria-label="The wheel: choose a letter to add it to your word"></svg>

      <div class="entry" id="entry">
        <input id="word" type="text" maxlength="9" placeholder="Type or tap letters" aria-label="Your word"
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button class="next" type="button" id="add">Add word</button>
      </div>

      <p class="result" id="result" aria-live="polite"></p>

      <div class="buttons">
        <button class="show" type="button" id="del">Delete</button>
        <button class="show" type="button" id="shuffle">Shuffle</button>
        <button class="show" type="button" id="hintBtn">Hint</button>
      </div>
    </div>

    <div class="side">
      <p class="count">Words found <b id="count">0</b> / <span id="target"></span></p>
      <ol class="slots" id="slots" aria-label="Words found"></ol>

      <p class="nine-label">The 9-letter word</p>
      <ol class="nine" id="nine" aria-label="The 9-letter word"></ol>

      <p class="answers" id="answers" hidden></p>

      <div class="buttons">
        <button class="show" type="button" id="reveal">Show answers</button>
        <button class="next end" type="button" id="newWheel">New wheel</button>
      </div>
    </div>
  </div>
</main>

<!-- The sign that comes up at ten words. Escape works like "Find more words". -->
<dialog class="done" id="done" aria-labelledby="doneTitle">
  <div class="stripe"></div>
  <form method="dialog">
    <h2 id="doneTitle">Well done!</h2>
    <p id="doneText"></p>
    <div class="buttons">
      <button class="next" type="submit" value="more">Find more words</button>
      <button class="show" type="submit" value="end">End challenge</button>
    </div>
  </form>
</dialog>

    if (revealed || $("done").open || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t === input) return;
    const onControl = t instanceof HTMLButtonElement || t instanceof HTMLAnchorElement;
    if (/^[a-zA-Z]$/.test(e.key)) {
      if (input.value.length < 9) { input.value += e.key.toLowerCase(); markUsed(); }
    } else if (e.key === "Backspace") {
      input.value = input.value.slice(0, -1); markUsed();
    } else if (e.key === "Enter" && !onControl) {
      e.preventDefault(); addWord();
    }
  });

  $("target").textContent = TARGET;
  newWheel();
})();
</script>
</body>
</html>
