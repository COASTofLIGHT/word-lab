<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Similar Different</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --paper: #FFFFFF;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --sea: #17677A;
    --sea-deep: #124F5E;
    --focus: #0B62A4;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    /* Pairs and Odd one out: tile colours are set by the game (see MODES in the script) */
    --words-c: #F4B5A0;
    --linker-c: #C9C3EA;
    /* Opposites */
    --first: #C7DE9F;    /* the word on the left */
    --second: #F0C2D3;   /* its opposite, once shown */
    --ask: #F2D9A6;      /* the questions */
    --late: #F4B5A0;     /* last ten seconds of the timer */
    /* Two meanings */
    --clue1: #A9CCEB;
    --clue2: #C9C3EA;
    --answer: #A8D5CB;   /* the word, once shown */
  }

  *, *::before, *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 1300px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: clamp(0.85rem, 2.6vw, 2rem);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Title, tabs and the way back ---------- */

  .top {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    column-gap: clamp(1rem, 2.5vw, 2rem);
  }

  .top h1 {
    margin: 0 0 0.6rem;
    font-size: clamp(1.4rem, 2.8vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .back {
    margin: 0 0 0.75rem auto;
    color: var(--ink-soft);
    font-size: 0.9rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* Tabs: the chosen one joins on to the frame underneath. */
  .tabs { display: flex; gap: 0.2rem; }

  .tab {
    height: 2.75rem;
    padding: 0 1.15rem;
    border: 0;
    border-radius: 0.7rem 0.7rem 0 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.55); color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--paper); color: var(--ink); }
  .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* ---------- The frame: one game at a time ---------- */

  .frame {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(0.7rem, 1.6vw, 1.1rem);
    border-radius: 0.9rem;
    background: var(--paper);
  }

  .game {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(0.55rem, 1.5vh, 0.9rem);
  }

  .intro {
    flex: 0 0 auto;
    margin: 0;
    padding: 0 0.15rem;
    color: var(--ink-soft);
    font-size: clamp(1rem, 1.9vw, 1.3rem);
    line-height: 1.3;
  }

  .controls {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem;
  }

  .btn, .btn-primary {
    height: 2.6rem;
    padding: 0 1.3rem;
    border-radius: 0.6rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }

  .btn {
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--line);
  }
  .btn:hover { border-color: var(--ink); }

  .btn-primary {
    background: var(--sea);
    color: #fff;
    border: 0;
  }
  .btn-primary:hover { background: var(--sea-deep); }

  .btn:active, .btn-primary:active { transform: translateY(1px); }
  .btn:focus-visible, .btn-primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .push { margin-left: auto; }

  .tip {
    margin: 0 0 0 auto;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  /* Two-way switches: Classic / Creative, and the minutes */
  .switch {
    display: inline-flex;
    height: 2.6rem;
    border: 2px solid var(--line);
    border-radius: 0.6rem;
    overflow: hidden;
  }
  .switch button {
    padding: 0 0.95rem;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .switch button.on { background: var(--ink); color: #fff; }
  .switch button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* ---------- Pairs and Odd one out ---------- */

  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: stretch;
    gap: clamp(0.6rem, 1.6vw, 1.1rem);
  }

  .tile {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    height: 100%;
    padding: clamp(1rem, 2.6vw, 2rem);
    border: 0;
    border-radius: 0.7rem;
    overflow: hidden;
    color: var(--ink);
    font: inherit;
    text-align: center;
    cursor: pointer;
  }
  .tile:hover { filter: brightness(0.97); }
  .tile:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  #words-tile { flex: 1.3 1 0; background: var(--words-c); }
  #linker-tile { flex: 1 1 0; background: var(--linker-c); }

  .tag {
    position: absolute;
    top: 1.1rem;
    left: 1.3rem;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .words {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15em;
    max-width: 100%;
    max-height: 100%;
  }

  .words .word {
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.02em;
    max-width: 100%;
    white-space: nowrap;
  }

  .linker {
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    max-width: 100%;
    white-space: nowrap;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(0.4rem); }
    to   { opacity: 1; transform: none; }
  }
  .fresh { animation: settle 0.22s ease-out; }

  /* ---------- Opposites ---------- */

  .pair {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(0.6rem, 1.6vw, 1.1rem);
  }

  .box {
    container-type: size;
    display: grid;
    place-items: center;
    align-content: center;
    min-height: 6rem;
    padding: clamp(0.75rem, 2vw, 1.5rem);
    border-radius: 0.7rem;
    text-align: center;
  }

  /* Both words share one size: --n is the longest run of letters, --l the number of lines. */
  .big {
    font-size: clamp(2rem, 6vw, 5rem);
    font-size: clamp(1.6rem, min(calc(150cqi / var(--n, 8)), calc(60cqb / var(--l, 1))), 8rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    text-wrap: balance;
  }

  .first { background: var(--first); }

  /* The second box is covered by a "?" button until it is opened. */
  .second {
    position: relative;
    border: 3px dashed rgba(16, 48, 58, 0.3);
  }
  .second:hover { border-color: var(--ink-soft); }
  .second.shown { background: var(--second); border-color: transparent; }

  .cover {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 0.5rem;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    cursor: pointer;
  }
  .cover .big { font-weight: 700; }
  .cover:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  .second.shown .big { animation: arrive 0.35s ease-out both; }
  @keyframes arrive { from { opacity: 0; transform: scale(0.9); } }

  /* Creative: the class's own opposite is typed straight into the box. */
  .own {
    width: 100%;
    padding: 0.08em 0;
    border: 0;
    border-top: 3px solid transparent;      /* balances the line below, so the word sits level with its partner */
    border-bottom: 3px solid transparent;
    border-radius: 0;
    background: transparent;
    color: inherit;
    font-family: inherit;
    line-height: 1.15;
    text-align: center;
  }
  .own::placeholder { color: rgba(16, 48, 58, 0.4); opacity: 1; }
  .own:focus { outline: none; border-bottom-color: rgba(16, 48, 58, 0.4); }
  .hint {
    margin: 0.5rem 0 0;
    color: var(--ink-soft);
    font-size: clamp(0.9rem, 1.3vw, 1.05rem);
  }

  /* The questions */
  .ask {
    flex: 0 0 auto;
    padding: clamp(0.8rem, 1.8vw, 1.25rem) clamp(1rem, 2.2vw, 1.6rem);
    border-radius: 0.7rem;
    background: var(--ask);
  }
  .ask p {
    margin: 0;
    font-size: clamp(1.1rem, min(2.3vw, 3.8vh), 1.9rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    text-wrap: balance;
  }
  .ask p + p { margin-top: 0.3em; }
  .ask.fresh { animation: none; }
  .ask.fresh p { animation: settle 0.3s ease-out both; }
  .ask.fresh p + p { animation-delay: 0.08s; }

  /* Timer */
  .timer {
    margin-top: clamp(0.5rem, 1.4vh, 0.9rem);
    display: flex;
    align-items: center;
    gap: clamp(0.75rem, 1.5vw, 1.25rem);
  }
  .time {
    font-size: clamp(1.8rem, min(4vw, 6vh), 3.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    min-width: 3.3ch;
  }
  .track {
    flex: 1;
    height: 0.8rem;
    border-radius: 999px;
    background: rgba(16, 48, 58, 0.15);
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--ink);
    transition: width 0.25s linear, background-color 0.3s ease;
  }
  .timer.late .fill { background: var(--late); }
  /* When time is up, the message takes the place of the bar. */
  .after {
    display: none;
    flex: 1;
    margin: 0;
    font-size: clamp(1.05rem, 1.6vw, 1.35rem);
    font-weight: 700;
    line-height: 1.25;
  }
  .timer.done .track { display: none; }
  .timer.done .after { display: block; }
  .unit { font-weight: 700; margin-left: -0.4rem; }

  /* ---------- Two meanings ---------- */

  /* A clue on each side, the word they share in the middle. */
  .trio {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 0.85fr 1fr;
    gap: clamp(0.6rem, 1.6vw, 1.1rem);
  }

  .clue {
    container-type: size;
    display: grid;
    place-items: center;
    min-height: 6rem;
    padding: clamp(0.9rem, 2vw, 1.6rem);
    border-radius: 0.7rem;
    text-align: center;
  }
  .clue:first-child { background: var(--clue1); }
  .clue:last-child { background: var(--clue2); }
  .clue p {
    margin: 0;
    font-size: clamp(1.15rem, 2.4vw, 2rem);
    font-size: clamp(1.15rem, min(9cqi, 15cqb), 2.5rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    text-wrap: balance;
  }

  .trio .second.shown { background: var(--answer); }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ---------- Smaller screens ---------- */

  /* The tabs drop to their own row, flush with the frame's left edge. */
  @media (max-width: 1000px) {
    .tabs { order: 3; flex-basis: 100%; }
    .back { margin-bottom: 0.6rem; }
    .frame { border-top-left-radius: 0; }
  }

  /* Phones: everything stacks and the page scrolls if it needs to. */
  @media (max-width: 720px) {
    html, body { height: auto; overflow: auto; }
    .page { height: auto; min-height: 100vh; min-height: 100dvh; }
    /* Four tabs on a narrow screen: smaller, and they slide sideways if they still don't fit. */
    .tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 0 0.5rem; font-size: 0.85rem; }
    .stage { flex-direction: column; min-height: 24rem; }
    #words-tile, #linker-tile { flex: 1 1 0; }
    .pair, .trio { grid-template-columns: 1fr; }
    .trio .box { order: 3; }   /* clue, clue, then the word */
    .box { min-height: 8.5rem; }
    .clue { min-height: 7rem; }
    .timer { flex-wrap: wrap; }
    .push { margin-left: 0; }
    .tip { margin-left: 0; flex-basis: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fresh, .ask.fresh p, .second.shown .big { animation: none; }
    .fill { transition: none; }
  }
</style>
</head>
<body>
<main class="page">

  <div class="top">
    <h1>Similar Different</h1>
    <div class="tabs" role="tablist" aria-label="Games" id="tabs"></div>
    <a class="back" href="./">&larr; Word Lab</a>
  </div>

  <div class="frame">

    <!-- Pairs and Odd one out share this panel: words on the left, a linker on the right. -->
    <section class="game" id="linker-game" role="tabpanel">
      <p class="intro" id="intro"></p>

      <div class="stage">
        <button type="button" class="tile" id="words-tile">
          <span class="tag" aria-hidden="true" id="words-tag"></span>
          <span class="words" id="words"></span>
        </button>
        <button type="button" class="tile" id="linker-tile" aria-label="Click for the next linker">
          <span class="tag" aria-hidden="true">Linker</span>
          <span class="linker" id="linker"></span>
        </button>
      </div>

      <div class="controls">
        <button type="button" class="btn" id="new-words-btn"></button>
        <button type="button" class="btn" id="new-linker-btn">New linker</button>
        <button type="button" class="btn-primary" id="random-btn">Random</button>
        <p class="tip" id="tip"></p>
      </div>
    </section>

    <!-- Opposites: one word, then its opposite, then the questions. -->
    <section class="game" id="opposites-game" role="tabpanel" aria-labelledby="tab-opposites" hidden>
      <div class="pair" id="pair">
        <div class="box first"><span class="big" id="first"></span></div>
        <div class="box second" id="second">
          <button type="button" class="cover" id="cover"><span class="big">?</span></button>
          <span class="big" id="second-word" hidden></span>
          <input class="big own" id="own" type="text" maxlength="24" placeholder="?" aria-label="Your opposite"
                 autocomplete="off" autocapitalize="off" spellcheck="false" hidden>
          <p class="hint" id="hint" hidden>Type your opposite here</p>
        </div>
      </div>

      <div class="ask" id="ask" aria-live="polite">
        <p id="line1"></p>
        <p id="line2"></p>

        <div class="timer" id="timer" hidden>
          <div class="time" id="time" role="timer" aria-live="off">1:00</div>
          <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
          <p class="after" id="after" aria-live="polite"></p>
          <div class="switch" role="group" aria-label="Minutes">
            <button type="button" data-min="1" aria-label="1 minute" class="on">1</button>
            <button type="button" data-min="2" aria-label="2 minutes">2</button>
          </div>
          <span class="unit">min</span>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn-primary" id="show">Show the opposite</button>
        <button type="button" class="btn" id="sides" hidden>Take sides</button>
        <button type="button" class="btn-primary" id="start" hidden>Start</button>
        <button type="button" class="btn" id="reset" hidden>Reset</button>
        <button type="button" class="btn" id="sound" aria-pressed="true" hidden>Sound on</button>
        <div class="switch push" role="group" aria-label="Kind of opposite">
          <button type="button" data-kind="classic" class="on" aria-pressed="true">Classic</button>
          <button type="button" data-kind="creative" aria-pressed="false">Creative</button>
        </div>
        <button type="button" class="btn" id="next">New word</button>
      </div>
    </section>

    <!-- Two meanings: two clues, one word. -->
    <section class="game" id="meanings-game" role="tabpanel" aria-labelledby="tab-meanings" hidden>
      <div class="trio">
        <div class="clue"><p id="clue1"></p></div>
        <div class="box second" id="m-box">
          <button type="button" class="cover" id="m-cover" aria-label="Show the word"><span class="big">?</span></button>
          <span class="big" id="m-word" hidden></span>
        </div>
        <div class="clue"><p id="clue2"></p></div>
      </div>

      <div class="ask" id="m-ask" aria-live="polite">
        <p id="m-line"></p>
      </div>

      <div class="controls">
        <button type="button" class="btn-primary" id="m-show">Show the word</button>
        <div class="switch push" role="group" aria-label="Level">
          <button type="button" data-level="a2" class="on" aria-pressed="true">A2</button>
          <button type="button" data-level="b1" aria-pressed="false">B1</button>
        </div>
        <button type="button" class="btn" id="m-next">New word</button>
      </div>
    </section>

  </div>

  <p class="sr" role="status" id="status"></p>
</main>

<script>
/* ---------------------------------------------------------------
   Four games on one page, chosen with the tabs at the top.
   A link can open a tab directly: ?mode=pairs, ?mode=odd,
   ?mode=opposites or ?mode=meanings. Otherwise the page opens on
   the last one used.
---------------------------------------------------------------- */
const GAMES = [
  { id: "pairs", label: "Pairs" },
  { id: "odd", label: "Odd one out" },
  { id: "opposites", label: "Opposites" },
  { id: "meanings", label: "Two meanings" }
];

/* ---------------------------------------------------------------
   PAIRS and ODD ONE OUT

   pairs: two things that are similar in some ways and different in
   others — one array of two strings per line.

   odd: three words, one of which is the odd one out (deliberately
   open to more than one valid answer, same as the classroom game)
   — one array of three strings per line.

   Each has its own linkers, which cycle independently of the
   words, so any set can be explained with an easier or harder
   linker. Add or remove words and linkers freely.
---------------------------------------------------------------- */
const MODES = {
  pairs: {
    label: "Pairs",
    intro: "How are they similar? How are they different? Use the word on the right in your explanation.",
    tag: "Pair",
    newLabel: "New pair",
    tileLabel: "Click for a new pair",
    tip: "Click the pair for a new one. Click the linker for another way to explain it.",
    wordsColour: "#F4B5A0",
    linkerColour: "#C9C3EA",
    maxSize: 130,
    linkers: [
      "however",
      "but",
      "on the one hand / on the other hand",
      "the main difference",
      "both",
      "whereas",
      "while",
      "in contrast",
      "a similarity is",
      "a difference is"
    ],
    sets: [
    ["February", "July"],
    ["cat", "dog"],
    ["Cadiz", "El Puerto"],
    ["carrot", "strawberry"],
    ["France", "Argentina"],
    ["nose", "feet"],
    ["knife", "sword"],
    ["coffee", "lemonade"],
    ["teacher", "student"],
    ["contacts", "glasses"],
    ["message", "letter"],
    ["talking", "shouting"],
    ["bracelet", "ring"],
    ["button", "zip"],
    ["basket", "bucket"],
    ["lamp", "torch"],
    ["Saturday", "May"],
    ["drawing", "photograph"],
    ["cash", "coins"],
    ["traffic light", "stop sign"],
    ["coffee", "soda"],
    ["map", "globe"],
    ["lift", "escalator"],
    ["sofa", "bed"],
    ["Manchester", "Barcelona"],
    ["Nintendo", "Sony"],
    ["iPhone", "Android"],
    ["Netflix", "YouTube"],
    ["Instagram", "Snapchat"],
    ["Spotify", "Apple Music"],
    ["PlayStation", "Xbox"],
    ["WhatsApp", "Telegram"],
    ["Uber", "taxi"],
    ["Amazon", "local shop"],
    ["Zoom", "phone call"],
    ["e-book", "audiobook"]
    ]
  },

  odd: {
    label: "Odd one out",
    intro: "Which word is different from the others, and why? Explain your answer using the word on the right.",
    tag: "Words",
    newLabel: "New set",
    tileLabel: "Click for a new set of words",
    tip: "Click the words for a new set. Click the linker for another way to explain it.",
    wordsColour: "#A8D5CB",
    linkerColour: "#A9CCEB",
    maxSize: 120,
    linkers: [
      "however",
      "but",
      "on the other hand",
      "neither",
      "although",
      "the difference",
      "both",
      "whereas",
      "unlike",
      "while",
      "in contrast"
    ],
    sets: [
    ["February", "April", "Monday"],
    ["cat", "dog", "turtle"],
    ["dolphin", "shark", "elephant"],
    ["aubergine", "carrot", "strawberry"],
    ["Argentina", "Italy", "Spain"],
    ["ear", "nose", "feet"],
    ["teaspoon", "fork", "knife"],
    ["coffee", "hot chocolate", "lemonade"],
    ["doctor", "teacher", "student"],
    ["potato", "banana", "apple"],
    ["drum", "guitar", "violin"],

const $ = (id) => document.getElementById(id);

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

/* ---------- which game: from the link if it has one (?mode=odd), otherwise the last one used, otherwise pairs ---------- */

function loadMode() {
  const known = (id) => GAMES.some((g) => g.id === id);
  const fromLink = (new URLSearchParams(location.search).get("mode") || "").toLowerCase();
  if (known(fromLink)) return fromLink;
  try {
    const saved = localStorage.getItem("similar.mode");
    if (known(saved)) return saved;
  } catch (e) { /* storage unavailable */ }
  return "pairs";
}

let mode = loadMode();

const wordsTile = $("words-tile");

const wordsEl = $("words");
const linkerEl = $("linker");
const newWordsBtn = $("new-words-btn");

/* Each game keeps its own place, so switching back carries on where it left off. */
const state = {};
Object.keys(MODES).forEach((id) => {
  state[id] = { deck: [], current: null, linkerOrder: shuffle(MODES[id].linkers.slice()), linkerPos: 0 };
});

/* ---------- words: drawn from a shuffled deck so sets don't repeat until the pool is used ---------- */

function showWords() {
  const set = state[mode].current;
  wordsEl.innerHTML = set.map(() => '<span class="word"></span>').join("");
  [...wordsEl.children].forEach((el, i) => { el.textContent = set[i]; });
  wordsEl.classList.remove("fresh");
  void wordsEl.offsetWidth;
  wordsEl.classList.add("fresh");
  fitWords();
}

function nextWords() {
  const st = state[mode];
  if (!st.deck.length) st.deck = shuffle(MODES[mode].sets.slice());
  let set = st.deck.pop();
  if (set === st.current && st.deck.length) set = st.deck.pop();
  st.current = set;
  showWords();
  announce();
}

/* ---------- linker: cycles through a shuffled order, then reshuffles and starts again ---------- */

function showLinker() {
  const st = state[mode];
  linkerEl.textContent = st.linkerOrder[st.linkerPos];
  linkerEl.classList.remove("fresh");
  void linkerEl.offsetWidth;
  linkerEl.classList.add("fresh");
  fitLinker();
  announce();
}

function nextLinker() {
  const st = state[mode];
  if (st.linkerPos < st.linkerOrder.length - 1) {
    st.linkerPos++;
  } else {
    st.linkerOrder = shuffle(MODES[mode].linkers.slice());
    st.linkerPos = 0;
  }
  showLinker();
}

function announce() {
  const st = state[mode];
  const words = st.current ? st.current.join(", ") : "";
  statusEl.textContent = MODES[mode].tag + ": " + words + ". Linker: " + st.linkerOrder[st.linkerPos];
}

/* ---------- sizing: shrink each panel's text to fit, then let it grow back on resize ---------- */

function fitWords() {
  const items = [...wordsEl.children];
  if (!items.length || !MODES[mode]) return;
  const style = getComputedStyle(wordsTile);
  const innerW = wordsTile.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const innerH = wordsTile.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  if (innerW <= 0 || innerH <= 0) return;

  let size = Math.min(innerH / items.length * 0.62, innerW * 0.26, MODES[mode].maxSize);
  size = Math.max(size, 16);
  items.forEach((el) => { el.style.fontSize = size + "px"; });

  let guard = 0;
  while (guard++ < 60 && size > 15) {
    const totalH = wordsEl.scrollHeight;
    const maxLineW = Math.max(...items.map((el) => el.scrollWidth));
    if (totalH <= innerH + 1 && maxLineW <= innerW + 1) break;
    size *= 0.94;
    items.forEach((el) => { el.style.fontSize = size + "px"; });
  }
}

function fitLinker() {
  const style = getComputedStyle(linkerTile);
  const innerW = linkerTile.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const innerH = linkerTile.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  if (innerW <= 0 || innerH <= 0) return;

  let size = Math.min(innerH * 0.4, innerW * 0.22, 110);
  size = Math.max(size, 16);
  linkerEl.style.fontSize = size + "px";

  let guard = 0;
  while (guard++ < 60 && size > 15 && linkerEl.scrollWidth > innerW + 1) {
    size *= 0.94;
    linkerEl.style.fontSize = size + "px";
  }
}

wordsTile.addEventListener("click", nextWords);
linkerTile.addEventListener("click", nextLinker);
newWordsBtn.addEventListener("click", nextWords);
$("new-linker-btn").addEventListener("click", nextLinker);
$("random-btn").addEventListener("click", () => {
  nextWords();
  nextLinker();
});

let resizeFrame;
function scheduleRefit() {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => { fitWords(); fitLinker(); });
}
window.addEventListener("resize", scheduleRefit);
window.addEventListener("orientationchange", scheduleRefit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleRefit);
if (window.ResizeObserver) {
  new ResizeObserver(scheduleRefit).observe(wordsTile);
  new ResizeObserver(scheduleRefit).observe(linkerTile);
}

function showLinkerGame() {
  const m = MODES[mode];
  $("intro").textContent = m.intro;
  $("words-tag").textContent = m.tag;
  $("tip").textContent = m.tip;
  newWordsBtn.textContent = m.newLabel;
  wordsTile.setAttribute("aria-label", m.tileLabel);
  document.documentElement.style.setProperty("--words-c", m.wordsColour);
  document.documentElement.style.setProperty("--linker-c", m.linkerColour);
  linkerGame.setAttribute("aria-labelledby", "tab-" + mode);
  if (state[mode].current) showWords(); else nextWords();
  showLinker();
}


/* ===============================================================
   Opposites
================================================================ */

const pairEl = $("pair"), firstEl = $("first"), secondBox = $("second"), secondWordEl = $("second-word");
const coverBtn = $("cover"), ownEl = $("own"), hintEl = $("hint");
const askEl = $("ask"), line1 = $("line1"), line2 = $("line2");
const timerEl = $("timer"), timeEl = $("time"), fillEl = $("fill"), afterEl = $("after");
const showBtn = $("show"), sidesBtn = $("sides"), startBtn = $("start");
const resetBtn = $("reset"), soundBtn = $("sound"), nextBtn = $("next");

let kind = "classic";   // classic: a set opposite. creative: the class decides.
let stage = "";         // guess -> talk -> sides ("" until the tab is first opened)
let word = "", opposite = "";
const decks = { classic: [], creative: [] };

/* Deals every pair or word once before any comes round again. */
function deal() {
  const list = kind === "classic" ? OPPOSITES : CREATIVE_WORDS;
  if (!decks[kind].length) decks[kind] = shuffle(list.slice());
  return decks[kind].pop();
}

/* ---------- timer ---------- */

let length = 60;      // seconds chosen
let left = 60;        // seconds left
let endAt = 0, ticking = null;
let sound = true, audio = null;

function paint() {
  const s = Math.ceil(left);
  timeEl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  fillEl.style.width = (left / length) * 100 + "%";
  timerEl.classList.toggle("late", left > 0 && left <= 10);
  timerEl.classList.toggle("done", left <= 0);
  startBtn.textContent = ticking ? "Pause" : left <= 0 ? "Start again" : left < length ? "Carry on" : "Start";
  afterEl.textContent = left <= 0 ? "Time's up. Who had the better reasons?" : "";
}

function stopTimer() { clearInterval(ticking); ticking = null; }

function chime() {
  if (!sound || !audio) return;
  [660, 880].forEach((freq, i) => {
    const osc = audio.createOscillator(), gain = audio.createGain();
    const t = audio.currentTime + i * 0.28;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    osc.connect(gain).connect(audio.destination);
    osc.start(t); osc.stop(t + 0.75);
  });
}

function step() {
  left = Math.max(0, (endAt - Date.now()) / 1000);
  if (left <= 0) { stopTimer(); chime(); }
  paint();
}

function startPause() {
  if (ticking) { stopTimer(); paint(); return; }
  if (left <= 0) left = length;
  // Browsers only allow sound after a click, so the sound is set up here.
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) { audio = null; }
  endAt = Date.now() + left * 1000;
  ticking = setInterval(step, 200);
  paint();
}

function resetTimer() { stopTimer(); left = length; paint(); }

startBtn.addEventListener("click", startPause);
resetBtn.addEventListener("click", resetTimer);
document.querySelectorAll("[data-min]").forEach((b) => b.addEventListener("click", () => {
  length = Number(b.dataset.min) * 60;
  document.querySelectorAll("[data-min]").forEach((x) => x.classList.toggle("on", x === b));
  resetTimer();
}));
soundBtn.addEventListener("click", () => {
  sound = !sound;
  soundBtn.textContent = sound ? "Sound on" : "Sound off";
  soundBtn.setAttribute("aria-pressed", sound);
});

/* ---------- the three stages ---------- */

function say(a, b) {
  line1.textContent = a;
  line2.textContent = b || "\u00A0";   // keeps the box the same height
  askEl.classList.remove("fresh");
  void askEl.offsetWidth;
  askEl.classList.add("fresh");
}

function setStage(name) {
  stage = name;
  const sides = name === "sides";
  showBtn.hidden = name !== "guess";
  sidesBtn.hidden = name !== "talk";
  timerEl.hidden = startBtn.hidden = resetBtn.hidden = soundBtn.hidden = !sides;
  // "New word" becomes the main button once there is nothing left to show.
  nextBtn.className = name === "talk" ? "btn-primary" : "btn";
  resetTimer();
}

/* Both words share one size: wide enough for the longest word, short enough for the most lines. */
function fitOpposites() {
  const parts = word.split(" ");
  const longest = (t) => Math.max(...t.split(" ").map((w) => w.length));
  const other = kind === "classic" ? longest(opposite) : ownEl.value.length;
  pairEl.style.setProperty("--n", Math.max(longest(word), other, 5));
  pairEl.style.setProperty("--l", kind === "classic" ? Math.max(parts.length, opposite.split(" ").length) : parts.length);
}

// 1. One word. What's the opposite?
function newWord() {
  const creative = kind === "creative";
  const dealt = deal();
  [word, opposite] = creative ? [dealt, ""] : shuffle(dealt.slice());
  firstEl.textContent = word;
  ownEl.value = "";
  secondBox.classList.remove("shown");
  coverBtn.hidden = false;
  secondWordEl.hidden = ownEl.hidden = hintEl.hidden = true;
  showBtn.textContent = creative ? "Show the questions" : "Show the opposite";
  coverBtn.setAttribute("aria-label", showBtn.textContent);
  fitOpposites();
  setStage("guess");
  if (creative) say("What's the opposite, in your opinion?", "There's no wrong answer.");
  else say("What's the opposite?", "");
}

// 2. The opposite (or a space to write the class's own), and the questions.
function showOpposite(typeNow) {
  if (stage !== "guess") return;
  const creative = kind === "creative";
  coverBtn.hidden = true;
  secondWordEl.textContent = opposite;
  secondWordEl.hidden = creative;
  ownEl.hidden = hintEl.hidden = !creative;
  secondBox.classList.add("shown");
  setStage("talk");
  say("Give an example of the difference between the two words.", "Which one is better, and why?");
  if (creative && typeNow) ownEl.focus();
}

// 3. One word each, against the clock.
function takeSides() {
  setStage("sides");
  say("With a partner, choose one word each.", "Argue why your word is better.");
}

showBtn.addEventListener("click", () => showOpposite(false));
coverBtn.addEventListener("click", () => showOpposite(true));   // tapping the box means "let me write in it"
sidesBtn.addEventListener("click", takeSides);
nextBtn.addEventListener("click", newWord);

ownEl.addEventListener("input", () => { hintEl.hidden = ownEl.value !== ""; fitOpposites(); });
ownEl.addEventListener("keydown", (e) => { if (e.key === "Enter") ownEl.blur(); });

document.querySelectorAll("[data-kind]").forEach((b) => b.addEventListener("click", () => {
  kind = b.dataset.kind;
  document.querySelectorAll("[data-kind]").forEach((x) => {
    x.classList.toggle("on", x === b);
    x.setAttribute("aria-pressed", x === b);
  });
  newWord();
}));

function showOppositesGame() {
  if (!stage) newWord();   // first visit; after that it carries on where it left off
}


/* ===============================================================
   Two meanings
================================================================ */

const clue1El = $("clue1"), clue2El = $("clue2");
const mBox = $("m-box"), mCover = $("m-cover"), mWordEl = $("m-word");
const mAsk = $("m-ask"), mLine = $("m-line"), mShowBtn = $("m-show"), mNextBtn = $("m-next");

let level = "a2";
let mEntry = null;        // the word and clues on screen (null until the tab is first opened)
let mShown = false;
const mDecks = { a2: [], b1: [] };

function mSay(text) {
  mLine.textContent = text;
  mAsk.classList.remove("fresh");
  void mAsk.offsetWidth;
  mAsk.classList.add("fresh");
}

// 1. Two clues. What's the word?
function newMeaning() {
  if (!mDecks[level].length) mDecks[level] = shuffle(MEANINGS[level].slice());
  mEntry = mDecks[level].pop();
  clue1El.textContent = mEntry[1];
  clue2El.textContent = mEntry[2];
  mBox.style.setProperty("--n", Math.max(mEntry[0].length, 5));
  mBox.classList.remove("shown");
  mCover.hidden = false;
  mWordEl.hidden = true;
  mShown = false;
  mShowBtn.hidden = false;
  mNextBtn.className = "btn";
  mSay("One word, two meanings. What's the word?");
}

// 2. The word, then a sentence for each meaning.
function showMeaning() {
  if (!mEntry || mShown) return;
  mWordEl.textContent = mEntry[0];
  mWordEl.hidden = false;
  mCover.hidden = true;
  mBox.classList.add("shown");
  mShown = true;
  mShowBtn.hidden = true;
  mNextBtn.className = "btn-primary";
  mSay("Now make one sentence for each meaning.");
}

mShowBtn.addEventListener("click", showMeaning);
mCover.addEventListener("click", showMeaning);
mNextBtn.addEventListener("click", newMeaning);

document.querySelectorAll("[data-level]").forEach((b) => b.addEventListener("click", () => {
  level = b.dataset.level;
  document.querySelectorAll("[data-level]").forEach((x) => {
    x.classList.toggle("on", x === b);
    x.setAttribute("aria-pressed", x === b);
  });
  newMeaning();
}));

function showMeaningsGame() {
  if (!mEntry) newMeaning();   // first visit; after that it carries on where it left off
}


/* ===============================================================
   The tabs
================================================================ */

function applyMode() {
  const opposites = mode === "opposites";
  const meanings = mode === "meanings";
  tabsEl.querySelectorAll(".tab").forEach((tab) => {
    const on = tab.id === "tab-" + mode;
    tab.setAttribute("aria-selected", on);
    tab.tabIndex = on ? 0 : -1;
    if (on && tabsEl.scrollWidth > tabsEl.clientWidth) tab.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
  linkerGame.hidden = opposites || meanings;
  oppositesGame.hidden = !opposites;
  meaningsGame.hidden = !meanings;
  if (!opposites && ticking) { stopTimer(); paint(); }   // leaving Opposites pauses its timer
  if (opposites || meanings) statusEl.textContent = "";
  if (opposites) showOppositesGame();
  else if (meanings) showMeaningsGame();
  else showLinkerGame();
}

function chooseMode(id) {
  mode = id;
  try { localStorage.setItem("similar.mode", mode); } catch (e) { /* ignore */ }
  applyMode();
}

GAMES.forEach((game) => {
  const tab = document.createElement("button");
  tab.type = "button";
  tab.className = "tab";
  tab.id = "tab-" + game.id;
  tab.setAttribute("role", "tab");
  tab.setAttribute("aria-controls", MODES[game.id] ? "linker-game" : game.id + "-game");
  tab.textContent = game.label;
  tab.addEventListener("click", () => chooseMode(game.id));
  tabsEl.appendChild(tab);
});

/* Left and right arrows move between the tabs when one of them has the focus. */
tabsEl.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
  const at = GAMES.findIndex((g) => g.id === mode);
  const to = GAMES[(at + (event.key === "ArrowRight" ? 1 : GAMES.length - 1)) % GAMES.length];
  chooseMode(to.id);
  $("tab-" + to.id).focus();
});

/* ---------- keyboard ----------
   Space or Enter moves the game on: a new set of words, or in Opposites and Two meanings
   the reveal and then a new word. L gives a new linker. N gives a new word. */
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const target = event.target.closest ? event.target : document.body;
  if (target.closest("input[type='text']")) return;   // typing an opposite, not giving an order
  const press = event.code === "Space" || event.code === "Enter";
  if (press && target.closest("button, input")) return;

  if (mode === "opposites") {
    if (press) { event.preventDefault(); if (stage === "guess") showOpposite(false); else newWord(); }
    else if (event.key === "n" || event.key === "N") newWord();
  } else if (mode === "meanings") {
    if (press) { event.preventDefault(); if (mShown) newMeaning(); else showMeaning(); }
    else if (event.key === "n" || event.key === "N") newMeaning();
  } else {
    if (press) { event.preventDefault(); nextWords(); }
    else if (event.key === "l" || event.key === "L") nextLinker();
  }
});

applyMode();
</script>
</body>
</html>
